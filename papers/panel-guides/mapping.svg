<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="Arial, sans-serif" font-size="18" fill="#243b32" role="img" aria-label="Four facts on the left, three messages on the right, joined by lines. Two highlighted lines converge on the middle message, which carries two facts at once.">
  <text x="20" y="32" font-size="14" fill="#627168">four facts to carry</text>
  <text x="400" y="32" font-size="14" fill="#627168">three messages to carry them</text>
  <rect x="20" y="60" width="280" height="64" rx="6" fill="#f3f6f0" stroke="#dce1d8"/>
  <text x="40" y="86" font-weight="bold" font-size="14">1</text>
  <text x="60" y="86" font-size="14">the client's starting number</text>
  <text x="60" y="108" font-size="14">reaches the server</text>
  <rect x="20" y="134" width="280" height="64" rx="6" fill="#f3f6f0" stroke="#dce1d8"/>
  <text x="40" y="160" font-weight="bold" font-size="14">2</text>
  <text x="60" y="160" font-size="14">the server's starting number</text>
  <text x="60" y="182" font-size="14">reaches the client</text>
  <rect x="20" y="208" width="280" height="64" rx="6" fill="#f3f6f0" stroke="#dce1d8"/>
  <text x="40" y="234" font-weight="bold" font-size="14">3</text>
  <text x="60" y="234" font-size="14">the client learns</text>
  <text x="60" y="256" font-size="14">its number arrived</text>
  <rect x="20" y="282" width="280" height="64" rx="6" fill="#f3f6f0" stroke="#dce1d8"/>
  <text x="40" y="308" font-weight="bold" font-size="14">4</text>
  <text x="60" y="308" font-size="14">the server learns</text>
  <text x="60" y="330" font-size="14">its number arrived</text>
  <rect x="400" y="66" width="180" height="62" rx="6" fill="#ffffff" stroke="#dce1d8"/>
  <text x="416" y="94" font-weight="bold" font-size="14">message 1</text>
  <text x="416" y="116" font-size="14">client to server</text>
  <rect x="400" y="170" width="180" height="62" rx="6" fill="#ffffff" stroke="#2f6f5e" stroke-width="1.5"/>
  <text x="416" y="198" font-weight="bold" font-size="14">message 2</text>
  <text x="416" y="220" font-size="14">server to client</text>
  <rect x="400" y="274" width="180" height="62" rx="6" fill="#ffffff" stroke="#dce1d8"/>
  <text x="416" y="302" font-weight="bold" font-size="14">message 3</text>
  <text x="416" y="324" font-size="14">client to server</text>
  <text x="592" y="198" font-size="14" fill="#2f6f5e" font-weight="bold">two facts</text>
  <text x="592" y="220" font-size="14" fill="#2f6f5e" font-weight="bold">in one message</text>
  <line x1="300" y1="92" x2="400" y2="92" stroke="#c3ccbd" stroke-width="1.25"/>
  <circle cx="400" cy="92" r="2.5" fill="#c3ccbd"/>
  <line x1="300" y1="166" x2="400" y2="196" stroke="#2f6f5e" stroke-width="1.5"/>
  <circle cx="400" cy="196" r="2.5" fill="#2f6f5e"/>
  <line x1="300" y1="240" x2="400" y2="216" stroke="#2f6f5e" stroke-width="1.5"/>
  <circle cx="400" cy="216" r="2.5" fill="#2f6f5e"/>
  <line x1="300" y1="314" x2="400" y2="314" stroke="#c3ccbd" stroke-width="1.25"/>
  <circle cx="400" cy="314" r="2.5" fill="#c3ccbd"/>
  <text x="20" y="380" font-size="14">the first message has nothing yet to acknowledge, and the last carries only that acknowledgement</text>
</svg>
