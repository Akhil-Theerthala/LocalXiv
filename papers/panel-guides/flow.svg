<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" font-family="Arial, sans-serif" font-size="18" fill="#243b32" role="img" aria-label="Two endpoint boxes, client and server, joined by one arrow in each direction. Each arrow carries a row of number tiles: an unknown starting value, then two increments. The two counters are separate.">
