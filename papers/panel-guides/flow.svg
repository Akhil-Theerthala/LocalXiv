  <text x="101" y="146" text-anchor="middle" font-size="14">192.168.1.24</text>
  <text x="101" y="168" text-anchor="middle" font-size="14" fill="#627168">port 51820</text>
  <text x="599" y="118" text-anchor="middle" font-weight="bold">server</text>
  <text x="599" y="146" text-anchor="middle" font-size="14">203.0.113.9</text>
  <text x="599" y="168" text-anchor="middle" font-size="14" fill="#627168">port 443</text>
  <text x="350" y="44" text-anchor="middle" font-size="14" fill="#627168">the client's counter</text>
  <line x1="186" y1="100" x2="502" y2="100" stroke="#2f6f5e" stroke-width="2"/>
  <path d="M 502 93 L 514 100 L 502 107 Z" fill="#2f6f5e"/>
  <line x1="514" y1="196" x2="198" y2="196" stroke="#2f6f5e" stroke-width="2"/>
  <path d="M 198 189 L 186 196 L 198 203 Z" fill="#2f6f5e"/>
  <rect x="232" y="56" width="28" height="30" rx="4" fill="#eef1ea" stroke="#9aa79a" stroke-width="1.75" stroke-dasharray="4 3"/>
  <text x="246" y="77" text-anchor="middle" font-weight="bold" font-size="14">?</text>
  <rect x="268" y="56" width="88" height="30" rx="4" fill="#ffffff" stroke="#dce1d8"/>
  <text x="312" y="76" text-anchor="middle" font-size="14">8,532,412</text>
  <rect x="364" y="56" width="88" height="30" rx="4" fill="#ffffff" stroke="#dce1d8"/>
  <text x="408" y="76" text-anchor="middle" font-size="14">8,532,413</text>
  <rect x="232" y="210" width="28" height="30" rx="4" fill="#eef1ea" stroke="#9aa79a" stroke-width="1.75" stroke-dasharray="4 3"/>
  <text x="246" y="231" text-anchor="middle" font-weight="bold" font-size="14">?</text>
  <rect x="268" y="210" width="88" height="30" rx="4" fill="#ffffff" stroke="#dce1d8"/>
  <text x="312" y="230" text-anchor="middle" font-size="14">2,741,020</text>
  <rect x="364" y="210" width="88" height="30" rx="4" fill="#ffffff" stroke="#dce1d8"/>
  <text x="408" y="230" text-anchor="middle" font-size="14">2,741,021</text>
  <text x="350" y="266" text-anchor="middle" font-size="14" fill="#627168">the server's counter</text>
  <text x="350" y="310" text-anchor="middle" font-size="14">two counters, and neither side has seen the other's starting value</text>
</svg>
