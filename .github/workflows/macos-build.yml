name: Build macOS test DMG

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, such as 0.1.0-beta.1
        required: true
        default: 0.1.0-beta.1

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: brew install python@3.14 pandoc latexml librsvg ghostscript epubcheck node
      - name: Install locked JavaScript dependencies
        run: npm ci --ignore-scripts --omit=dev
      - name: Check source
        run: |
          python3 -m unittest discover -s tests -p 'test_release*.py' -v
          bash -n launch.command install-app.sh
          node --check app/static/app.js
      - name: Build portable app and local test DMG
        run: python3 app/macos/build-release.py --version "$RELEASE_VERSION" --build-number "$GITHUB_RUN_NUMBER"
      - name: Validate moved application
        run: |
          app_path="dist/LocalXiv-$RELEASE_VERSION-macOS26-arm64-unsigned-local/LocalXiv.app"
          python3 app/macos/verify-release.py "$app_path" --report dist/verification.json
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LocalXiv-macOS26-arm64-local-test
          path: |
            dist/**/*.dmg
            dist/**/SHA256SUMS
            dist/**/release.json
            dist/verification.json
          if-no-files-found: error
          retention-days: 14
