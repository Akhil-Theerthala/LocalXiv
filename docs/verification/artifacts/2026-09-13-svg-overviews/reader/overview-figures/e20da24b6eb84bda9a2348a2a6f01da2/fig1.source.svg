  <text x="40" y="194" font-size="28" font-weight="700">2. The combined state feeds a repeated block</text>
  <rect x="48" y="220" width="190" height="44" rx="9" fill="#dce8cf" />
  <text x="143" y="249" text-anchor="middle" font-size="24">Combined state</text>
