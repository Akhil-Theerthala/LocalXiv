  <text x="459" y="266" text-anchor="middle" font-size="22">repeated N times</text>
  <path d="M 562 242 H 662" fill="none" stroke="#243b32" stroke-width="3" marker-end="url(#arrow)" />
  <text x="682" y="249" font-size="24">Output</text>

