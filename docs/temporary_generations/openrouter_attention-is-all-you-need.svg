<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 2157" font-family="Arial, sans-serif" font-size="14" fill="#243b32"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 2 L 8 5 L 1 8 Z" fill="#243b32" /></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 2 L 8 5 L 1 8 Z" fill="#627168" /></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 2 L 8 5 L 1 8 Z" fill="#2f6f5e" /></marker></defs><text x="24" y="36" font-size="14" fill="#627168">LOCALXIV · Attention Is All You Need</text><text x="24" y="66" font-size="26" font-weight="700">Transformer: Attention-Only Encoder–Decoder Architecture</text><text x="24" y="101" font-size="15">A three-level view of the Transformer: concrete masked attention, repeated encoder and decoder sub-layers, and the full autoregressive</text><text x="24" y="121" font-size="15">system with WMT14 results and scaling limits.</text><rect id="frame-1" x="24" y="153" width="952" height="852" rx="12" fill="#ffffff" stroke="#dce1d8" stroke-width="1.5" /><rect x="38" y="167" width="380.719" height="26" rx="6" fill="#e1ebf1" /><text x="50" y="185" font-size="15" font-weight="700" fill="#2b5876">Level 1: Attention Core with Concrete Dimensions</text><rect x="38" y="203" width="416.531" height="200" rx="10" fill="#fbfcfa" fill-opacity="0.35" stroke="#dce1d8" stroke-width="1.2" /><text x="52" y="219" font-size="14" font-weight="700" fill="#243b32">Sinusoidal positional encoding</text><rect x="52" y="239" width="388.531" height="68" rx="7" fill="#ffffff" stroke="#c3ccbd" stroke-width="1" /><text x="62" y="259" font-size="14" font-weight="700" fill="#243b32">Sinusoidal positional encoding</text><text x="62" y="277" font-size="14" fill="#627168">Dimension d_model = 512</text><rect x="52" y="321" width="388.531" height="68" rx="7" fill="#ffffff" stroke="#c3ccbd" stroke-width="1" /><text x="62" y="341" font-size="14" font-weight="700" fill="#243b32">Position-aware inputs</text><text x="62" y="359" font-size="14" fill="#627168">Adds order without recurrence or convolution</text><rect x="38" y="417" width="416.531" height="194" rx="10" fill="#e1ebf1" fill-opacity="0.35" stroke="#7f9fb5" stroke-width="1.2" /><text x="52" y="433" font-size="14" font-weight="700" fill="#2b5876">Encoder self-attention</text><rect x="52" y="453" width="43.0312" height="26" rx="6" fill="#ffffff" stroke="#c3ccbd" /><text x="73.5156" y="470" font-size="14" font-weight="700" fill="#243b32" text-anchor="middle">x1</text><text x="73.5156" y="493" font-size="14" fill="#627168" text-anchor="middle">input</text><rect x="101.031" y="453" width="43.0312" height="26" rx="6" fill="#ffffff" stroke="#c3ccbd" /><text x="122.547" y="470" font-size="14" font-weight="700" fill="#243b32" text-anchor="middle">x2</text><text x="122.547" y="493" font-size="14" fill="#627168" text-anchor="middle">input</text><rect x="150.062" y="453" width="43.0312" height="26" rx="6" fill="#dce8cf" stroke="#8aa87a" /><text x="171.578" y="470" font-size="14" font-weight="700" fill="#2f5d3a" text-anchor="middle">x3</text><text x="171.578" y="493" font-size="14" fill="#2f6f5e" text-anchor="middle">query</text><rect x="52" y="511" width="388.531" height="86" rx="6" fill="#f3f6f0" stroke="#dce1d8" /><text x="62" y="531" font-size="14" fill="#627168">1.</text><text x="82" y="531" font-size="14" fill="#243b32">Q, K, V projections: d_model = 512</text><text x="62" y="549" font-size="14" fill="#627168">2.</text><text x="82" y="549" font-size="14" fill="#243b32">softmax(QKᵀ/√d_k)V</text><text x="62" y="567" font-size="14" fill="#627168">3.</text><text x="82" y="567" font-size="14" fill="#243b32">d_k = d_v = 64; h = 8</text><text x="62" y="585" font-size="14" fill="#627168">4.</text><text x="82" y="585" font-size="14" font-weight="700" fill="#2f6f5e">Every input position can attend to every other</text><rect x="38" y="625" width="416.531" height="306" rx="10" fill="#f1e3d8" fill-opacity="0.35" stroke="#c9a08a" stroke-width="1.2" /><text x="52" y="641" font-size="14" font-weight="700" fill="#7a4a2e">Masked decoder self-attention</text><text x="91.7969" y="673" font-size="14" fill="#627168" text-anchor="middle">y1</text><text x="125.797" y="673" font-size="14" fill="#627168" text-anchor="middle">y2</text><text x="159.797" y="673" font-size="14" fill="#627168" text-anchor="middle">y3</text><text x="68.7969" y="701" font-size="14" fill="#627168" text-anchor="end">y1</text><rect x="74.7969" y="679" width="34" height="34" fill="#dce8cf" stroke="#dce1d8" /><text x="91.7969" y="701" font-size="14" font-weight="700" text-anchor="middle">1</text><rect x="108.797" y="679" width="34" height="34" fill="#eef1ea" stroke="#dce1d8" stroke-dasharray="3 2" /><rect x="142.797" y="679" width="34" height="34" fill="#eef1ea" stroke="#dce1d8" stroke-dasharray="3 2" /><text x="68.7969" y="735" font-size="14" fill="#627168" text-anchor="end">y2</text><rect x="74.7969" y="713" width="34" height="34" fill="#ffffff" stroke="#dce1d8" /><text x="91.7969" y="735" font-size="14" text-anchor="middle">0.4</text><rect x="108.797" y="713" width="34" height="34" fill="#dce8cf" stroke="#dce1d8" /><text x="125.797" y="735" font-size="14" font-weight="700" text-anchor="middle">0.6</text><rect x="142.797" y="713" width="34" height="34" fill="#eef1ea" stroke="#dce1d8" stroke-dasharray="3 2" /><text x="68.7969" y="769" font-size="14" fill="#627168" text-anchor="end">y3</text><rect x="74.7969" y="747" width="34" height="34" fill="#ffffff" stroke="#dce1d8" /><text x="91.7969" y="769" font-size="14" text-anchor="middle">0.2</text><rect x="108.797" y="747" width="34" height="34" fill="#ffffff" stroke="#dce1d8" /><text x="125.797" y="769" font-size="14" text-anchor="middle">0.3</text><rect x="142.797" y="747" width="34" height="34" fill="#dce8cf" stroke="#dce1d8" /><text x="159.797" y="769" font-size="14" font-weight="700" text-anchor="middle">0.5</text><text x="52" y="795" font-size="14" fill="#627168">Future positions are</text><text x="52" y="813" font-size="14" fill="#627168">masked before</text><text x="52" y="831" font-size="14" fill="#627168">softmax</text><rect x="52" y="849" width="388.531" height="68" rx="6" fill="#f3f6f0" stroke="#dce1d8" /><text x="62" y="869" font-size="14" fill="#627168">1.</text><text x="82" y="869" font-size="14" fill="#243b32">softmax((QKᵀ + future-mask)/√d_k)V</text><text x="62" y="887" font-size="14" fill="#627168">2.</text><text x="82" y="887" font-size="14" fill="#243b32">Future connections receive −∞ before softmax</text><text x="62" y="905" font-size="14" fill="#627168">3.</text><text x="82" y="905" font-size="14" font-weight="700" fill="#2f6f5e">Only previous and current decoder positions remain</text><text x="38" y="969" font-size="14" font-weight="700" fill="#627168">Running example: with d_model = 512 and h = 8, each attention head uses d_k = d_v = 64.</text><text x="38" y="987" font-size="14" font-weight="700" fill="#627168">PE(pos,2i)=sin(pos/10000^(2i/d_model)); PE(pos,2i+1)=cos(pos/10000^(2i/d_model))</text><rect id="frame-2" x="24" y="1023" width="952" height="620" rx="12" fill="#ffffff" stroke="#dce1d8" stroke-width="1.5" /><rect x="38" y="1037" width="396.625" height="26" rx="6" fill="#dce8cf" /><text x="50" y="1055" font-size="15" font-weight="700" fill="#2f5d3a">Level 2: Repeated Encoder and Decoder Sub-Layers</text><rect x="38" y="1073" width="437.403" height="396" rx="10" fill="#e1ebf1" fill-opacity="0.35" stroke="#7f9fb5" stroke-width="1.2" /><text x="52" y="1089" font-size="14" font-weight="700" fill="#2b5876">Encoder stack ×6</text><rect x="52" y="1109" width="409.403" height="264" rx="10" fill="#fbfcfa" fill-opacity="0.35" stroke="#dce1d8" stroke-width="1.2" /><text x="66" y="1125" font-size="14" font-weight="700" fill="#243b32">Encoder layer ×6</text><rect x="66" y="1145" width="381.403" height="50" rx="7" fill="#ffffff" stroke="#c3ccbd" stroke-width="1" /><text x="76" y="1165" font-size="14" font-weight="700" fill="#243b32">Encoder self-attention</text><text x="76" y="1183" font-size="14" fill="#627168">softmax(QKᵀ/√d_k)V</text><rect x="66" y="1209" width="381.403" height="68" rx="7" fill="#ffffff" stroke="#c3ccbd" stroke-width="1" /><text x="76" y="1229" font-size="14" font-weight="700" fill="#243b32">Encoder feed-forward network</text><text x="76" y="1247" font-size="14" fill="#627168">max(0, xW₁ + b₁)W₂ + b₂</text><rect x="66" y="1291" width="381.403" height="68" rx="7" fill="#ffffff" stroke="#c3ccbd" stroke-width="1" /><text x="76" y="1311" font-size="14" font-weight="700" fill="#243b32">Encoder residual normalization</text><text x="76" y="1329" font-size="14" fill="#627168">LayerNorm(x + Sublayer(x))</text><rect x="52" y="1387" width="409.403" height="68" rx="7" fill="#ffffff" stroke="#c3ccbd" stroke-width="1" /><text x="62" y="1407" font-size="14" fill="#243b32">Encoder stack</text><text x="62" y="1425" font-size="14" fill="#627168">Contextual representations; all sub-layer outputs d_model =</text><text x="62" y="1443" font-size="14" fill="#627168">512</text><rect x="489.403" y="1073" width="460" height="496" rx="10" fill="#f1e3d8" fill-opacity="0.35" stroke="#c9a08a" stroke-width="1.2" /><text x="503.403" y="1089" font-size="14" font-weight="700" fill="#7a4a2e">Decoder stack ×6</text><rect x="503.403" y="1109" width="432" height="364" rx="10" fill="#fbfcfa" fill-opacity="0.35" stroke="#dce1d8" stroke-width="1.2" /><text x="517.403" y="1125" font-size="14" font-weight="700" fill="#243b32">Decoder layer ×6</text><rect x="517.403" y="1145" width="404" height="68" rx="7" fill="#ffffff" stroke="#c3ccbd" stroke-width="1" /><text x="527.403" y="1165" font-size="14" font-weight="700" fill="#243b32">Masked decoder self-attention</text><text x="527.403" y="1183" font-size="14" fill="#627168">softmax((QKᵀ + future-mask)/√d_k)V</text><rect x="517.403" y="1227" width="404" height="68" rx="7" fill="#dce8cf" stroke="#8aa87a" stroke-width="1.5" /><text x="527.403" y="1247" font-size="14" font-weight="700" fill="#2f5d3a">Encoder-decoder attention</text><text x="527.403" y="1265" font-size="14" fill="#627168">softmax(Q_decoder K_encoderᵀ/√d_k)V_encoder</text><rect x="517.403" y="1309" width="404" height="68" rx="7" fill="#ffffff" stroke="#c3ccbd" stroke-width="1" /><text x="527.403" y="1329" font-size="14" font-weight="700" fill="#243b32">Decoder feed-forward network</text><text x="527.403" y="1347" font-size="14" fill="#627168">max(0, xW₁ + b₁)W₂ + b₂</text><rect x="517.403" y="1391" width="404" height="68" rx="7" fill="#ffffff" stroke="#c3ccbd" stroke-width="1" /><text x="527.403" y="1411" font-size="14" font-weight="700" fill="#243b32">Decoder residual normalization</text><text x="527.403" y="1429" font-size="14" fill="#627168">LayerNorm(x + Sublayer(x))</text><rect x="503.403" y="1487" width="432" height="68" rx="7" fill="#ffffff" stroke="#c3ccbd" stroke-width="1" /><text x="513.403" y="1507" font-size="14" fill="#243b32">Decoder stack</text><text x="513.403" y="1525" font-size="14" fill="#627168">Autoregressive generation over encoder representations</text><path d="M 256.702 1195 L 256.702 1206" fill="none" stroke="#243b32" stroke-width="1.6" marker-end="url(#arrow)" /><path d="M 256.702 1277 L 256.702 1288" fill="none" stroke="#243b32" stroke-width="1.6" marker-end="url(#arrow)" /><path d="M 719.403 1213 L 719.403 1224" fill="none" stroke="#243b32" stroke-width="1.6" marker-end="url(#arrow)" /><path d="M 719.403 1295 L 719.403 1306" fill="none" stroke="#243b32" stroke-width="1.6" marker-end="url(#arrow)" /><path d="M 719.403 1377 L 719.403 1388" fill="none" stroke="#243b32" stroke-width="1.6" marker-end="url(#arrow)" /><text x="38" y="1607" font-size="14" font-weight="700" fill="#627168">Each layer combines attention, position-wise transformation, residual connections, and layer normalization.</text><text x="38" y="1625" font-size="14" font-weight="700" fill="#627168">Feed-forward width: 512 → 2048 → 512.</text><rect id="frame-3" x="24" y="1661" width="952" height="388" rx="12" fill="#ffffff" stroke="#dce1d8" stroke-width="1.5" /><rect x="38" y="1675" width="349.109" height="26" rx="6" fill="#f1e3d8" /><text x="50" y="1693" font-size="15" font-weight="700" fill="#7a4a2e">Level 3: Full Transformer System and Results</text><rect x="38" y="1711" width="298.667" height="236" rx="10" fill="#e1ebf1" fill-opacity="0.35" stroke="#7f9fb5" stroke-width="1.2" /><text x="52" y="1727" font-size="14" font-weight="700" fill="#2b5876">Transformer</text><rect x="52" y="1747" width="128.333" height="68" rx="7" fill="#ffffff" stroke="#c3ccbd" stroke-width="1" /><text x="62" y="1767" font-size="14" fill="#243b32">Sinusoidal</text><text x="62" y="1785" font-size="14" fill="#243b32">positional</text><text x="62" y="1803" font-size="14" fill="#243b32">encoding</text><rect x="52" y="1829" width="128.333" height="50" rx="7" fill="#ffffff" stroke="#c3ccbd" stroke-width="1" /><text x="62" y="1849" font-size="14" fill="#243b32">Encoder stack</text><rect x="194.333" y="1747" width="128.333" height="50" rx="7" fill="#ffffff" stroke="#c3ccbd" stroke-width="1" /><text x="204.333" y="1767" font-size="14" fill="#243b32">Decoder stack</text><rect x="194.333" y="1811" width="128.333" height="122" rx="7" fill="#dce8cf" stroke="#8aa87a" stroke-width="1.5" /><text x="204.333" y="1831" font-size="14" font-weight="700" fill="#2f5d3a">Autoregressive</text><text x="204.333" y="1849" font-size="14" font-weight="700" fill="#2f5d3a">output</text><text x="204.333" y="1867" font-size="14" font-weight="700" fill="#2f5d3a">generation</text><text x="204.333" y="1885" font-size="14" fill="#627168">Beam size 4;</text><text x="204.333" y="1903" font-size="14" fill="#627168">length penalty α</text><text x="204.333" y="1921" font-size="14" fill="#627168">= 0.6</text><rect x="350.667" y="1711" width="298.667" height="194" rx="10" fill="#dce8cf" fill-opacity="0.35" stroke="#8aa87a" stroke-width="1.2" /><text x="364.667" y="1727" font-size="14" font-weight="700" fill="#2f5d3a">Reported WMT14 results</text><text x="364.667" y="1762" font-size="14" fill="#627168">Transformer-big EN-DE</text><rect x="519.182" y="1751" width="57.4241" height="14" rx="3" fill="#c3ccbd" /><text x="582.606" y="1762" font-size="14">28.4</text><text x="364.667" y="1784" font-size="14" fill="#627168">Transformer-big EN-FR</text><rect x="519.182" y="1773" width="82.901" height="14" rx="3" fill="#2f6f5e" /><text x="608.083" y="1784" font-size="14" font-weight="700">41</text><text x="364.667" y="1805" font-size="14" fill="#627168">BLEU scores</text><rect x="364.667" y="1823" width="270.667" height="68" rx="7" fill="#ffffff" stroke="#c3ccbd" stroke-width="1" /><text x="374.667" y="1843" font-size="14" font-weight="700" fill="#243b32">P_drop = 0.1 (big EN-FR)</text><text x="374.667" y="1861" font-size="14" fill="#627168">Substantially less reported training cost</text><text x="374.667" y="1879" font-size="14" fill="#627168">than prior systems</text><rect x="663.333" y="1711" width="298.667" height="264" rx="10" fill="#fbfcfa" fill-opacity="0.35" stroke="#dce1d8" stroke-width="1.2" /><text x="677.333" y="1727" font-size="14" font-weight="700" fill="#243b32">Scaling qualification</text><rect x="677.333" y="1747" width="270.667" height="50" rx="7" fill="#f1e3d8" stroke="#c9a08a" stroke-width="1.5" /><text x="687.333" y="1767" font-size="14" font-weight="700" fill="#7a4a2e">Full self-attention</text><text x="687.333" y="1785" font-size="14" fill="#627168">O(n² · d) per layer</text><rect x="677.333" y="1811" width="270.667" height="68" rx="7" fill="#ffffff" stroke="#c3ccbd" stroke-width="1" stroke-dasharray="5 3" /><text x="687.333" y="1831" font-size="14" fill="#243b32">Restricted attention</text><text x="687.333" y="1849" font-size="14" fill="#627168">Long inputs may increase dependency</text><text x="687.333" y="1867" font-size="14" fill="#627168">path length to O(n/r)</text><rect x="677.333" y="1893" width="270.667" height="68" rx="7" fill="#ffffff" stroke="#c3ccbd" stroke-width="1" /><text x="687.333" y="1913" font-size="14" font-weight="700" fill="#243b32">Sentence-length advantage</text><text x="687.333" y="1931" font-size="14" fill="#627168">Parallel attention with short dependency</text><text x="687.333" y="1949" font-size="14" fill="#627168">paths</text><path d="M 116.167 1815 L 116.167 1826" fill="none" stroke="#243b32" stroke-width="1.6" marker-end="url(#arrow)" /><path d="M 180.333 1854 L 187.333 1854 L 187.333 1772 L 191.333 1772" fill="none" stroke="#2f6f5e" stroke-width="1.6" marker-end="url(#arrow-accent)" /><path d="M 258.5 1797 L 258.5 1808" fill="none" stroke="#2f6f5e" stroke-width="1.6" marker-end="url(#arrow-accent)" /><text x="38" y="2013" font-size="14" font-weight="700" fill="#627168">Hyperparameters: N_encoder = 6; N_decoder = 6; d_model = 512; h = 8; d_k = 64; d_v = 64; d_ff = 2048.</text><text x="38" y="2031" font-size="14" font-weight="700" fill="#627168">System flow: positional encoding → encoder representations → masked decoder attention → autoregressive output.</text><line x1="24" y1="2057" x2="976" y2="2057" stroke="#dce1d8" /><text x="24" y="2081" font-size="14"><tspan font-weight="700">Illustrative example.</tspan> The Transformer removes recurrence and convolution. Encoder and decoder stacks repeat six layers; attention is parallel across</text><text x="24" y="2101" font-size="14">positions, while masking preserves autoregressive decoding. Full self-attention costs O(n² · d) per layer, motivating restricted attention for very long</text><text x="24" y="2121" font-size="14">inputs.</text></svg>