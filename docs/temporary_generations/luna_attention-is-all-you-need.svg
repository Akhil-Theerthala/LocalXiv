<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1709" font-family="Arial, sans-serif" font-size="14" fill="#243b32"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 2 L 8 5 L 1 8 Z" fill="#243b32" /></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 2 L 8 5 L 1 8 Z" fill="#627168" /></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 2 L 8 5 L 1 8 Z" fill="#2f6f5e" /></marker></defs><text x="24" y="36" font-size="14" fill="#627168">LOCALXIV · Attention Is All You Need</text><text x="24" y="66" font-size="26" font-weight="700">Transformer: Multi-Head Attention Encoder–Decoder Architecture</text><text x="24" y="101" font-size="15">An encoder–decoder architecture based on multi-head attention, replacing recurrent layers with self-attention, encoder–decoder attention,</text><text x="24" y="121" font-size="15">feed-forward networks, residual normalization, and positional encodings.</text><rect id="frame-1" x="24" y="153" width="952" height="432" rx="12" fill="#ffffff" stroke="#dce1d8" stroke-width="1.5" /><rect x="38" y="167" width="201.562" height="26" rx="6" fill="#e1ebf1" /><text x="50" y="185" font-size="15" font-weight="700" fill="#2b5876">Level 1: Core Operations</text><rect x="38" y="203" width="455" height="218" rx="10" fill="#dce8cf" fill-opacity="0.35" stroke="#8aa87a" stroke-width="1.2" /><text x="52" y="219" font-size="14" font-weight="700" fill="#2f5d3a">Multi-head attention</text><rect x="52" y="239" width="206.5" height="50" rx="7" fill="#e1ebf1" stroke="#7f9fb5" stroke-width="1.5" /><text x="62" y="259" font-size="14" font-weight="700" fill="#2b5876">Encoder self-attention</text><text x="62" y="277" font-size="14" fill="#627168">softmax(QKᵀ / √d_k)V</text><rect x="52" y="303" width="206.5" height="86" rx="7" fill="#dce8cf" stroke="#8aa87a" stroke-width="1.5" /><text x="62" y="323" font-size="14" font-weight="700" fill="#2f5d3a">Encoder–decoder attention</text><text x="62" y="341" font-size="14" fill="#627168">softmax(Q_decoder</text><text x="62" y="359" font-size="14" fill="#627168">K_encoderᵀ /</text><text x="62" y="377" font-size="14" fill="#627168">√d_k)V_encoder</text><rect x="272.5" y="239" width="206.5" height="86" rx="7" fill="#f1e3d8" stroke="#c9a08a" stroke-width="1.5" /><text x="282.5" y="259" font-size="14" font-weight="700" fill="#7a4a2e">Masked decoder</text><text x="282.5" y="277" font-size="14" font-weight="700" fill="#7a4a2e">self-attention</text><text x="282.5" y="295" font-size="14" fill="#627168">softmax((QKᵀ + future_mask)</text><text x="282.5" y="313" font-size="14" fill="#627168">/ √d_k)V</text><rect x="272.5" y="339" width="206.5" height="68" rx="7" fill="#dce8cf" stroke="#8aa87a" stroke-width="1.5" /><text x="282.5" y="359" font-size="14" font-weight="700" fill="#2f5d3a">Multi-head attention</text><text x="282.5" y="377" font-size="14" fill="#627168">Concat(head₁, …, head₈)Wᴼ</text><rect x="507" y="203" width="455" height="368" rx="10" fill="#fbfcfa" fill-opacity="0.35" stroke="#dce1d8" stroke-width="1.2" /><text x="521" y="219" font-size="14" font-weight="700" fill="#243b32">Position and transformation</text><rect x="521" y="239" width="427" height="68" rx="7" fill="#f1e3d8" stroke="#c9a08a" stroke-width="1.5" /><text x="531" y="259" font-size="14" font-weight="700" fill="#7a4a2e">Sinusoidal positional encoding</text><text x="531" y="277" font-size="14" fill="#627168">PE(pos,2i)=sin(pos/10000^(2i/d_model));</text><text x="531" y="295" font-size="14" fill="#627168">PE(pos,2i+1)=cos(pos/10000^(2i/d_model))</text><rect x="521" y="321" width="427" height="68" rx="7" fill="#e1ebf1" stroke="#7f9fb5" stroke-width="1.5" /><text x="531" y="341" font-size="14" font-weight="700" fill="#2b5876">Encoder feed-forward network</text><text x="531" y="359" font-size="14" fill="#627168">max(0, xW₁ + b₁)W₂ + b₂</text><rect x="521" y="403" width="427" height="68" rx="7" fill="#e1ebf1" stroke="#7f9fb5" stroke-width="1.5" /><text x="531" y="423" font-size="14" font-weight="700" fill="#2b5876">Decoder feed-forward network</text><text x="531" y="441" font-size="14" fill="#627168">max(0, xW₁ + b₁)W₂ + b₂</text><rect x="521" y="485" width="427" height="72" rx="8" fill="#fbfcfa" stroke="#dce1d8" /><text x="533" y="507" font-size="14" font-weight="700" fill="#243b32">Shared mechanism:</text><text x="533" y="525" font-size="14" fill="#627168">8 heads; d_k = d_v = 64; concatenated output returns to</text><text x="533" y="543" font-size="14" fill="#627168">d_model = 512</text><path d="M 734.5 239 L 734.5 227 L 155.25 227 L 155.25 236" fill="none" stroke="#243b32" stroke-width="1.6" marker-end="url(#arrow)" /><text x="444.875" y="222" font-size="14" fill="#627168" text-anchor="middle">ordered inputs</text><path d="M 155.25 239 L 155.25 225 L 509 225 L 509 355 L 518 355" fill="none" stroke="#243b32" stroke-width="1.6" marker-end="url(#arrow)" /><text x="332.125" y="220" font-size="14" fill="#627168" text-anchor="middle">sub-layer</text><path d="M 272.5 282 L 265.5 282 L 265.5 346 L 261.5 346" fill="none" stroke="#243b32" stroke-width="1.6" marker-end="url(#arrow)" /><path d="M 155.25 389 L 155.25 417 L 734.5 417 L 734.5 468" fill="none" stroke="#243b32" stroke-width="1.6" marker-end="url(#arrow)" /><rect id="frame-2" x="24" y="603" width="952" height="474" rx="12" fill="#ffffff" stroke="#dce1d8" stroke-width="1.5" /><rect x="38" y="617" width="396.594" height="26" rx="6" fill="#dce8cf" /><text x="50" y="635" font-size="15" font-weight="700" fill="#2f5d3a">Level 2: Stacked Encoder and Decoder Composition</text><rect x="38" y="653" width="455" height="304" rx="10" fill="#e1ebf1" fill-opacity="0.35" stroke="#7f9fb5" stroke-width="1.2" /><text x="52" y="669" font-size="14" font-weight="700" fill="#2b5876">Encoder stack ×6</text><rect x="52" y="689" width="427" height="172" rx="10" fill="#fbfcfa" fill-opacity="0.35" stroke="#dce1d8" stroke-width="1.2" /><text x="66" y="705" font-size="14" font-weight="700" fill="#243b32">Encoder layer ×6</text><rect x="66" y="725" width="123.667" height="86" rx="7" fill="#e1ebf1" stroke="#7f9fb5" stroke-width="1.5" /><text x="76" y="745" font-size="14" font-weight="700" fill="#2b5876">Encoder</text><text x="76" y="763" font-size="14" font-weight="700" fill="#2b5876">self-attention</text><text x="76" y="781" font-size="14" fill="#627168">8 heads; d_k =</text><text x="76" y="799" font-size="14" fill="#627168">d_v = 64</text><rect x="203.667" y="725" width="123.667" height="104" rx="7" fill="#e1ebf1" stroke="#7f9fb5" stroke-width="1.5" /><text x="213.667" y="745" font-size="14" font-weight="700" fill="#2b5876">Encoder</text><text x="213.667" y="763" font-size="14" font-weight="700" fill="#2b5876">feed-forward</text><text x="213.667" y="781" font-size="14" font-weight="700" fill="#2b5876">network</text><text x="213.667" y="799" font-size="14" fill="#627168">512 → 2048 →</text><text x="213.667" y="817" font-size="14" fill="#627168">512</text><rect x="341.333" y="725" width="123.667" height="122" rx="7" fill="#ffffff" stroke="#c3ccbd" stroke-width="1" /><text x="351.333" y="745" font-size="14" font-weight="700" fill="#243b32">Residual</text><text x="351.333" y="763" font-size="14" font-weight="700" fill="#243b32">normalization</text><text x="351.333" y="781" font-size="14" fill="#627168">Residual</text><text x="351.333" y="799" font-size="14" fill="#627168">connections +</text><text x="351.333" y="817" font-size="14" fill="#627168">layer</text><text x="351.333" y="835" font-size="14" fill="#627168">normalization</text><rect x="52" y="875" width="427" height="68" rx="7" fill="#dce8cf" stroke="#8aa87a" stroke-width="1.5" /><text x="62" y="895" font-size="14" font-weight="700" fill="#2f5d3a">Contextual encoder outputs</text><text x="62" y="913" font-size="14" fill="#627168">Every position attends to every position</text><rect x="507" y="653" width="455" height="350" rx="10" fill="#f1e3d8" fill-opacity="0.35" stroke="#c9a08a" stroke-width="1.2" /><text x="521" y="669" font-size="14" font-weight="700" fill="#7a4a2e">Decoder stack ×6</text><rect x="521" y="689" width="427" height="218" rx="10" fill="#fbfcfa" fill-opacity="0.35" stroke="#dce1d8" stroke-width="1.2" /><text x="535" y="705" font-size="14" font-weight="700" fill="#243b32">Decoder layer ×6</text><rect x="535" y="725" width="192.5" height="86" rx="7" fill="#f1e3d8" stroke="#c9a08a" stroke-width="1.5" /><text x="545" y="745" font-size="14" font-weight="700" fill="#7a4a2e">Masked decoder</text><text x="545" y="763" font-size="14" font-weight="700" fill="#7a4a2e">self-attention</text><text x="545" y="781" font-size="14" fill="#627168">Future positions set to −∞</text><text x="545" y="799" font-size="14" fill="#627168">before softmax</text><rect x="535" y="825" width="192.5" height="68" rx="7" fill="#dce8cf" stroke="#8aa87a" stroke-width="1.5" /><text x="545" y="845" font-size="14" font-weight="700" fill="#2f5d3a">Encoder–decoder</text><text x="545" y="863" font-size="14" font-weight="700" fill="#2f5d3a">attention</text><text x="545" y="881" font-size="14" fill="#627168">8 heads; d_k = d_v = 64</text><rect x="741.5" y="725" width="192.5" height="68" rx="7" fill="#e1ebf1" stroke="#7f9fb5" stroke-width="1.5" /><text x="751.5" y="745" font-size="14" font-weight="700" fill="#2b5876">Decoder feed-forward</text><text x="751.5" y="763" font-size="14" font-weight="700" fill="#2b5876">network</text><text x="751.5" y="781" font-size="14" fill="#627168">512 → 2048 → 512</text><rect x="741.5" y="807" width="192.5" height="68" rx="7" fill="#ffffff" stroke="#c3ccbd" stroke-width="1" /><text x="751.5" y="827" font-size="14" font-weight="700" fill="#243b32">Residual normalization</text><text x="751.5" y="845" font-size="14" fill="#627168">Residual connections +</text><text x="751.5" y="863" font-size="14" fill="#627168">layer normalization</text><rect x="521" y="921" width="427" height="68" rx="7" fill="#f1e3d8" stroke="#c9a08a" stroke-width="1.5" /><text x="531" y="941" font-size="14" font-weight="700" fill="#7a4a2e">Autoregressive target states</text><text x="531" y="959" font-size="14" fill="#627168">Generated position-by-position</text><path d="M 189.667 768 L 196.667 768 L 196.667 777 L 200.667 777" fill="none" stroke="#243b32" stroke-width="1.6" marker-end="url(#arrow)" /><path d="M 631.25 811 L 631.25 822" fill="none" stroke="#243b32" stroke-width="1.6" marker-end="url(#arrow)" /><path d="M 727.5 859 L 734.5 859 L 734.5 759 L 738.5 759" fill="none" stroke="#243b32" stroke-width="1.6" marker-end="url(#arrow)" /><text x="38" y="1041" font-size="14" font-weight="700" fill="#627168">Encoder self-attention is unrestricted; decoder attention masks future tokens.</text><text x="38" y="1059" font-size="14" font-weight="700" fill="#627168">Hyperparameters: d_model = 512 · d_ff = 2048 · dropout = 0.1</text><rect id="frame-3" x="24" y="1095" width="952" height="506" rx="12" fill="#ffffff" stroke="#dce1d8" stroke-width="1.5" /><rect x="38" y="1109" width="349.109" height="26" rx="6" fill="#f1e3d8" /><text x="50" y="1127" font-size="15" font-weight="700" fill="#7a4a2e">Level 3: Full Transformer System and Results</text><rect x="38" y="1145" width="456.641" height="382" rx="10" fill="#dce8cf" fill-opacity="0.35" stroke="#8aa87a" stroke-width="1.2" /><text x="52" y="1161" font-size="14" font-weight="700" fill="#2f5d3a">Transformer</text><rect x="52" y="1181" width="428.641" height="68" rx="7" fill="#f1e3d8" stroke="#c9a08a" stroke-width="1.5" /><text x="62" y="1201" font-size="14" font-weight="700" fill="#7a4a2e">Token embeddings plus positions</text><text x="62" y="1219" font-size="14" fill="#627168">x = token_embedding + positional_encoding; d_model = 512</text><rect x="52" y="1263" width="428.641" height="118" rx="10" fill="#e1ebf1" fill-opacity="0.35" stroke="#7f9fb5" stroke-width="1.2" /><text x="66" y="1279" font-size="14" font-weight="700" fill="#2b5876">Encoder stack ×6</text><rect x="66" y="1299" width="400.641" height="68" rx="7" fill="#ffffff" stroke="#c3ccbd" stroke-width="1" /><text x="76" y="1319" font-size="14" font-weight="700" fill="#243b32">Encoder self-attention</text><text x="76" y="1337" font-size="14" fill="#627168">Self-attention + feed-forward + residual normalization</text><rect x="52" y="1395" width="428.641" height="118" rx="10" fill="#f1e3d8" fill-opacity="0.35" stroke="#c9a08a" stroke-width="1.2" /><text x="66" y="1411" font-size="14" font-weight="700" fill="#7a4a2e">Decoder stack ×6</text><rect x="66" y="1431" width="400.641" height="68" rx="7" fill="#ffffff" stroke="#c3ccbd" stroke-width="1" /><text x="76" y="1451" font-size="14" font-weight="700" fill="#243b32">Encoder–decoder attention</text><text x="76" y="1469" font-size="14" fill="#627168">Masked self-attention + cross-attention + feed-forward</text><rect x="508.641" y="1145" width="453.359" height="252" rx="10" fill="#dce8cf" fill-opacity="0.35" stroke="#8aa87a" stroke-width="1.2" /><text x="522.641" y="1161" font-size="14" font-weight="700" fill="#2f5d3a">WMT14 results</text><text x="522.641" y="1196" font-size="14" fill="#627168">English–German BLEU</text><rect x="675.391" y="1185" width="92.8195" height="14" rx="3" fill="#c3ccbd" /><text x="774.21" y="1196" font-size="14">28.4</text><text x="522.641" y="1218" font-size="14" fill="#627168">English–French BLEU</text><rect x="675.391" y="1207" width="134" height="14" rx="3" fill="#2f6f5e" /><text x="815.391" y="1218" font-size="14" font-weight="700">41</text><text x="522.641" y="1239" font-size="14" fill="#627168">Transformer big scores on WMT14</text><rect x="522.641" y="1257" width="425.359" height="68" rx="7" fill="#dce8cf" stroke="#8aa87a" stroke-width="1.5" /><text x="532.641" y="1277" font-size="14" font-weight="700" fill="#2f5d3a">Training cost</text><text x="532.641" y="1295" font-size="14" fill="#627168">3.5 days on 8 P100 GPUs for English–German</text><rect x="522.641" y="1339" width="110.906" height="26" rx="6" fill="#ffffff" stroke="#c3ccbd" /><text x="578.094" y="1356" font-size="14" font-weight="700" fill="#243b32" text-anchor="middle">beam size</text><text x="578.094" y="1379" font-size="14" fill="#627168" text-anchor="middle">4</text><rect x="639.547" y="1339" width="110.906" height="26" rx="6" fill="#f1e3d8" stroke="#c9a08a" /><text x="695" y="1356" font-size="14" font-weight="700" fill="#7a4a2e" text-anchor="middle">length penalty</text><text x="695" y="1379" font-size="14" fill="#2f6f5e" text-anchor="middle">α = 0.6</text><rect x="756.453" y="1339" width="110.906" height="26" rx="6" fill="#ffffff" stroke="#c3ccbd" /><text x="811.906" y="1356" font-size="14" font-weight="700" fill="#243b32" text-anchor="middle">dropout</text><text x="811.906" y="1379" font-size="14" fill="#627168" text-anchor="middle">0.1</text><path d="M 266.32 1249 L 266.32 1296" fill="none" stroke="#2f6f5e" stroke-width="1.6" marker-end="url(#arrow-accent)" /><text x="272.32" y="1277.5" font-size="14" fill="#627168">source sequence</text><path d="M 266.32 1367 L 266.32 1428" fill="none" stroke="#2f6f5e" stroke-width="1.6" marker-end="url(#arrow-accent)" /><text x="38" y="1565" font-size="14" font-weight="700" fill="#627168">Maps an input sequence to an autoregressively generated output sequence.</text><text x="38" y="1583" font-size="14" font-weight="700" fill="#627168">Self-attention connects all sequence positions in O(1) sequential steps; each layer costs O(n²·d).</text><line x1="24" y1="1609" x2="976" y2="1609" stroke="#dce1d8" /><text x="24" y="1633" font-size="14"><tspan font-weight="700">Paper-grounded diagram.</tspan> On WMT14, Transformer big reaches 28.4 BLEU on English–German and 41.0 BLEU on English–French; English–German</text><text x="24" y="1653" font-size="14">training takes 3.5 days on 8 P100 GPUs. Self-attention has O(1) sequential steps but costs O(n²·d) per layer; autoregressive decoding remains</text><text x="24" y="1673" font-size="14">position-by-position.</text></svg>