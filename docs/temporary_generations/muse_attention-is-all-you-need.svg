<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1381" font-family="Arial, sans-serif" font-size="14" fill="#243b32"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 2 L 8 5 L 1 8 Z" fill="#243b32" /></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 2 L 8 5 L 1 8 Z" fill="#627168" /></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 2 L 8 5 L 1 8 Z" fill="#2f6f5e" /></marker></defs><text x="24" y="36" font-size="14" fill="#627168">LOCALXIV · Attention Is All You Need</text><text x="24" y="66" font-size="26" font-weight="700">Transformer: Attention-Only Encoder-Decoder Transduction</text><text x="24" y="101" font-size="15">Scaled dot-product attention powers multi-head subspaces that compose into N=6 encoder and decoder layers with sinusoidal order and</text><text x="24" y="121" font-size="15">residual norms.</text><rect id="frame-1" x="24" y="153" width="952" height="276" rx="12" fill="#ffffff" stroke="#dce1d8" stroke-width="1.5" /><rect x="38" y="167" width="401.547" height="26" rx="6" fill="#e1ebf1" /><text x="50" y="185" font-size="15" font-weight="700" fill="#2b5876">Level 1: Scaled dot-product attention Core Operation</text><rect x="38" y="203" width="460" height="68" rx="7" fill="#e1ebf1" stroke="#7f9fb5" stroke-width="1.5" /><text x="48" y="223" font-size="14" font-weight="700" fill="#2b5876">Scaled dot-product attention</text><text x="48" y="241" font-size="14" fill="#627168">Attention(Q,K,V) = softmax(Q K^T / √d_k) V</text><rect x="38" y="285" width="460" height="86" rx="6" fill="#f3f6f0" stroke="#dce1d8" /><text x="48" y="305" font-size="14" fill="#627168">1.</text><text x="68" y="305" font-size="14" fill="#243b32">scores = Q K^T for query vs all keys</text><text x="48" y="323" font-size="14" fill="#627168">2.</text><text x="68" y="323" font-size="14" fill="#243b32">scale by 1/√d_k, d_k=64 scale 1/√d_k</text><text x="48" y="341" font-size="14" fill="#627168">3.</text><text x="68" y="341" font-size="14" fill="#243b32">softmax to weights summing to 1</text><text x="48" y="359" font-size="14" fill="#627168">4.</text><text x="68" y="359" font-size="14" font-weight="700" fill="#2f6f5e">Attention(Q,K,V) = softmax(Q K^T / √d_k) V</text><rect x="512" y="203" width="70.4688" height="26" rx="6" fill="#dce8cf" stroke="#8aa87a" /><text x="547.234" y="220" font-size="14" font-weight="700" fill="#2f5d3a" text-anchor="middle">Q: its</text><text x="547.234" y="243" font-size="14" fill="#2f6f5e" text-anchor="middle">query</text><rect x="588.469" y="203" width="70.4688" height="26" rx="6" fill="#ffffff" stroke="#c3ccbd" /><text x="623.703" y="220" font-size="14" font-weight="700" fill="#243b32" text-anchor="middle">K1 Law</text><text x="623.703" y="243" font-size="14" fill="#627168" text-anchor="middle">key</text><rect x="664.938" y="203" width="70.4688" height="26" rx="6" fill="#ffffff" stroke="#c3ccbd" /><text x="700.172" y="220" font-size="14" font-weight="700" fill="#243b32" text-anchor="middle">K2 appl.</text><text x="700.172" y="243" font-size="14" fill="#627168" text-anchor="middle">key</text><rect x="741.406" y="203" width="70.4688" height="26" rx="6" fill="#e1ebf1" stroke="#7f9fb5" /><text x="776.641" y="220" font-size="14" font-weight="700" fill="#2b5876" text-anchor="middle">V mix</text><text x="776.641" y="243" font-size="14" fill="#627168" text-anchor="middle">weighted</text><rect x="512" y="261" width="448.133" height="72" rx="8" fill="#fbfcfa" stroke="#dce1d8" /><text x="524" y="283" font-size="14" font-weight="700" fill="#243b32">Core compatibility weighting</text><text x="524" y="301" font-size="14" fill="#627168">Values weighted by scaled query-key similarity</text><rect x="512" y="347" width="448.133" height="68" rx="7" fill="#f3f6f0" stroke="#dce1d8" stroke-width="1" /><text x="522" y="367" font-size="14" font-weight="700" fill="#243b32">Scale and softmax</text><text x="522" y="385" font-size="14" fill="#627168">d_k=64, scale 1/√d_k</text><rect id="frame-2" x="24" y="447" width="952" height="450" rx="12" fill="#ffffff" stroke="#dce1d8" stroke-width="1.5" /><rect x="38" y="461" width="498.281" height="26" rx="6" fill="#dce8cf" /><text x="50" y="479" font-size="15" font-weight="700" fill="#2f5d3a">Level 2: Multi-head attention with Encoder layer and Decoder layer</text><rect x="38" y="497" width="298.667" height="86" rx="7" fill="#dce8cf" stroke="#8aa87a" stroke-width="1.5" /><text x="48" y="517" font-size="14" font-weight="700" fill="#2f5d3a">Multi-head attention</text><text x="48" y="535" font-size="14" fill="#627168">MultiHead(Q,K,V) =</text><text x="48" y="553" font-size="14" fill="#627168">Concat(head_1...head_h) W^O, head_i =</text><text x="48" y="571" font-size="14" fill="#627168">Attention(Q W^Q_i, K W^K_i, V W^V_i)</text><rect x="350.667" y="497" width="298.667" height="350" rx="10" fill="#e1ebf1" fill-opacity="0.35" stroke="#7f9fb5" stroke-width="1.2" /><text x="364.667" y="513" font-size="14" font-weight="700" fill="#2b5876">Encoder layer ×6</text><rect x="364.667" y="533" width="270.667" height="68" rx="7" fill="#e1ebf1" stroke="#7f9fb5" stroke-width="1.5" /><text x="374.667" y="553" font-size="14" font-weight="700" fill="#2b5876">Encoder self-attention</text><text x="374.667" y="571" font-size="14" fill="#627168">MultiHead(Q,K,V) where Q=K=V=prev</text><text x="374.667" y="589" font-size="14" fill="#627168">layer output</text><rect x="364.667" y="615" width="270.667" height="68" rx="7" fill="#ffffff" stroke="#c3ccbd" stroke-width="1" /><text x="374.667" y="635" font-size="14" font-weight="700" fill="#243b32">Encoder feed-forward</text><text x="374.667" y="653" font-size="14" fill="#627168">d_model=512, d_ff=2048 base</text><rect x="364.667" y="697" width="270.667" height="68" rx="7" fill="#ffffff" stroke="#c3ccbd" stroke-width="1" /><text x="374.667" y="717" font-size="14" font-weight="700" fill="#243b32">Residual + LayerNorm</text><text x="374.667" y="735" font-size="14" fill="#627168">LayerNorm(x + Sublayer(x))</text><rect x="364.667" y="779" width="270.667" height="54" rx="8" fill="#fbfcfa" stroke="#dce1d8" /><text x="376.667" y="801" font-size="14" font-weight="700" fill="#243b32">output = LayerNorm(x + Sublayer(x))</text><text x="376.667" y="819" font-size="14" fill="#627168">for each sub-layer</text><rect x="663.333" y="497" width="298.667" height="386" rx="10" fill="#f1e3d8" fill-opacity="0.35" stroke="#c9a08a" stroke-width="1.2" /><text x="677.333" y="513" font-size="14" font-weight="700" fill="#7a4a2e">Decoder layer ×6</text><rect x="677.333" y="533" width="270.667" height="68" rx="7" fill="#f1e3d8" stroke="#c9a08a" stroke-width="1.5" /><text x="687.333" y="553" font-size="14" font-weight="700" fill="#7a4a2e">Decoder masked self-attention</text><text x="687.333" y="571" font-size="14" fill="#627168">MultiHead with mask = -∞ for illegal</text><text x="687.333" y="589" font-size="14" fill="#627168">future connections in softmax</text><rect x="677.333" y="615" width="270.667" height="68" rx="7" fill="#dce8cf" stroke="#8aa87a" stroke-width="1.5" /><text x="687.333" y="635" font-size="14" font-weight="700" fill="#2f5d3a">Encoder-decoder attention</text><text x="687.333" y="653" font-size="14" fill="#627168">MultiHead where Q=decoder layer,</text><text x="687.333" y="671" font-size="14" fill="#627168">K=V=encoder stack output</text><rect x="677.333" y="697" width="270.667" height="68" rx="7" fill="#ffffff" stroke="#c3ccbd" stroke-width="1" /><text x="687.333" y="717" font-size="14" font-weight="700" fill="#243b32">Decoder feed-forward</text><text x="687.333" y="735" font-size="14" fill="#627168">d_model=512, d_ff=2048 base</text><rect x="677.333" y="779" width="270.667" height="90" rx="8" fill="#fbfcfa" stroke="#dce1d8" /><text x="689.333" y="801" font-size="14" font-weight="700" fill="#243b32">output = LayerNorm(x + Sublayer(x))</text><text x="689.333" y="819" font-size="14" fill="#627168">for 3 sub-layers</text><text x="689.333" y="837" font-size="14" fill="#627168">training parallel, inference</text><text x="689.333" y="855" font-size="14" fill="#627168">autoregressive</text><path d="M 500 601 L 500 612" fill="none" stroke="#243b32" stroke-width="1.6" marker-end="url(#arrow)" /><path d="M 812.667 601 L 812.667 612" fill="none" stroke="#243b32" stroke-width="1.6" marker-end="url(#arrow)" /><path d="M 812.667 683 L 812.667 694" fill="none" stroke="#243b32" stroke-width="1.6" marker-end="url(#arrow)" /><rect id="frame-3" x="24" y="915" width="952" height="378" rx="12" fill="#ffffff" stroke="#dce1d8" stroke-width="1.5" /><rect x="38" y="929" width="431.219" height="26" rx="6" fill="#f1e3d8" /><text x="50" y="947" font-size="15" font-weight="700" fill="#7a4a2e">Level 3: Full Transformer (N=6) Encoder-Decoder System</text><rect x="38" y="965" width="387.5" height="68" rx="7" fill="#f1e3d8" stroke="#c9a08a" stroke-width="1.5" /><text x="48" y="985" font-size="14" font-weight="700" fill="#7a4a2e">Sinusoidal positional encoding</text><text x="48" y="1003" font-size="14" fill="#627168">PE(pos,2i)=sin(pos/10000^{2i/d_model}),</text><text x="48" y="1021" font-size="14" fill="#627168">PE(pos,2i+1)=cos(pos/10000^{2i/d_model})</text><rect x="38" y="1047" width="387.5" height="68" rx="7" fill="#ffffff" stroke="#c3ccbd" stroke-width="1" /><text x="48" y="1067" font-size="14" font-weight="700" fill="#243b32">Encoder stack</text><text x="48" y="1085" font-size="14" fill="#627168">N=6 identical layers, output dim 512</text><rect x="38" y="1129" width="387.5" height="68" rx="7" fill="#ffffff" stroke="#c3ccbd" stroke-width="1" /><text x="48" y="1149" font-size="14" font-weight="700" fill="#243b32">Decoder stack</text><text x="48" y="1167" font-size="14" fill="#627168">N=6 identical layers, output dim 512</text><rect x="38" y="1211" width="387.5" height="68" rx="7" fill="#e1ebf1" stroke="#7f9fb5" stroke-width="1.5" /><text x="48" y="1231" font-size="14" font-weight="700" fill="#2b5876">Transformer</text><text x="48" y="1249" font-size="14" fill="#627168">base: N=6, d_model=512; big: d_model=1024</text><rect x="439.5" y="965" width="223" height="68" rx="7" fill="#e1ebf1" stroke="#7f9fb5" stroke-width="1.5" /><text x="449.5" y="985" font-size="14" fill="#2b5876">Encoder layer</text><text x="449.5" y="1003" font-size="14" fill="#627168">2 sub-layers, dim 512</text><rect x="439.5" y="1047" width="223" height="104" rx="7" fill="#f1e3d8" stroke="#c9a08a" stroke-width="1.5" /><text x="449.5" y="1067" font-size="14" fill="#7a4a2e">Decoder layer</text><text x="449.5" y="1085" font-size="14" fill="#627168">output = LayerNorm(x +</text><text x="449.5" y="1103" font-size="14" fill="#627168">Sublayer(x)) for 3 sub-layers,</text><text x="449.5" y="1121" font-size="14" fill="#627168">training parallel, inference</text><text x="449.5" y="1139" font-size="14" fill="#627168">autoregressive</text><text x="676.5" y="980" font-size="14" fill="#627168">ConvS2S EN-DE</text><rect x="794.469" y="969" width="63.6932" height="14" rx="3" fill="#c3ccbd" /><text x="864.162" y="980" font-size="14">25.2</text><text x="676.5" y="1002" font-size="14" fill="#627168">Transformer base</text><rect x="794.469" y="991" width="69.001" height="14" rx="3" fill="#c3ccbd" /><text x="869.47" y="1002" font-size="14">27.3</text><text x="676.5" y="1024" font-size="14" fill="#627168">Transformer big</text><rect x="794.469" y="1013" width="71.7812" height="14" rx="3" fill="#2f6f5e" /><text x="872.25" y="1024" font-size="14" font-weight="700">28.4</text><text x="676.5" y="1045" font-size="14" fill="#627168">BLEU WMT 2014 EN-DE</text><text x="676.5" y="1063" font-size="14" fill="#627168">newstest2014; EN-FR big 41.8</text><rect x="676.5" y="1081" width="223" height="108" rx="8" fill="#fbfcfa" stroke="#dce1d8" /><text x="688.5" y="1103" font-size="14" font-weight="700" fill="#243b32">Autoregressive EN to DE</text><text x="688.5" y="1121" font-size="14" fill="#627168">example</text><text x="688.5" y="1139" font-size="14" fill="#627168">512-dim + sinusoid through 6</text><text x="688.5" y="1157" font-size="14" fill="#627168">layers, masked decode to</text><text x="688.5" y="1175" font-size="14" fill="#627168">German</text><path d="M 231.75 1033 L 231.75 1044" fill="none" stroke="#243b32" stroke-width="1.6" marker-end="url(#arrow)" /><path d="M 231.75 1115 L 231.75 1126" fill="none" stroke="#243b32" stroke-width="1.6" marker-end="url(#arrow)" /><line x1="24" y1="1301" x2="976" y2="1301" stroke="#dce1d8" /><text x="24" y="1325" font-size="14"><tspan font-weight="700">Paper-grounded diagram.</tspan> Base N=6 d_model=512 h=8 d_k=d_v=64 d_ff=2048; big d_model=1024 h=16. Big scores 28.4 BLEU EN-DE and 41.8</text><text x="24" y="1345" font-size="14">EN-FR on WMT 2014 newstest2014. Checkpoint averaging, beam 4, length penalty 0.6, max output input+50.</text></svg>