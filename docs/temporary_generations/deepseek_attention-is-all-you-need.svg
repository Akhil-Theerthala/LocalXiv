<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1951" font-family="Arial, sans-serif" font-size="14" fill="#243b32"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 2 L 8 5 L 1 8 Z" fill="#243b32" /></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 2 L 8 5 L 1 8 Z" fill="#627168" /></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 2 L 8 5 L 1 8 Z" fill="#2f6f5e" /></marker></defs><text x="24" y="36" font-size="14" fill="#627168">LOCALXIV · Attention Is All You Need</text><text x="24" y="66" font-size="26" font-weight="700">Transformer: Attention-Only Sequence Transduction</text><text x="24" y="101" font-size="15">Scaled dot-product attention is the primitive, h = 8 heads compose it into multi-head attention, and N = 6 encoder-decoder stacks give 28.4</text><text x="24" y="121" font-size="15">BLEU.</text><rect id="frame-1" x="24" y="153" width="952" height="272" rx="12" fill="#ffffff" stroke="#dce1d8" stroke-width="1.5" /><rect x="38" y="167" width="409.031" height="26" rx="6" fill="#e1ebf1" /><text x="50" y="185" font-size="15" font-weight="700" fill="#2b5876">1. Scaled Dot-Product Attention — the Core Operation</text><rect x="38" y="203" width="278.667" height="68" rx="7" fill="#e1ebf1" stroke="#7f9fb5" stroke-width="1.5" /><text x="48" y="223" font-size="14" font-weight="700" fill="#2b5876">Scaled Dot-Product Attention</text><text x="48" y="241" font-size="14" fill="#627168">Attention(Q,K,V) = softmax(QK^T/√d_k)V</text><rect x="38" y="285" width="278.667" height="68" rx="7" fill="#f3f6f0" stroke="#dce1d8" stroke-width="1" /><text x="48" y="305" font-size="14" font-weight="700" fill="#243b32">Scale by 1/√d_k</text><text x="48" y="323" font-size="14" fill="#627168">d_k = d_v = 64</text><rect x="38" y="367" width="53.9219" height="26" rx="6" fill="#ffffff" stroke="#c3ccbd" /><text x="64.9609" y="384" font-size="14" font-weight="700" fill="#243b32" text-anchor="middle">Q</text><text x="64.9609" y="407" font-size="14" fill="#627168" text-anchor="middle">queries</text><rect x="97.9219" y="367" width="53.9219" height="26" rx="6" fill="#ffffff" stroke="#c3ccbd" /><text x="124.883" y="384" font-size="14" font-weight="700" fill="#243b32" text-anchor="middle">K</text><text x="124.883" y="407" font-size="14" fill="#627168" text-anchor="middle">keys</text><rect x="157.844" y="367" width="53.9219" height="26" rx="6" fill="#ffffff" stroke="#c3ccbd" /><text x="184.805" y="384" font-size="14" font-weight="700" fill="#243b32" text-anchor="middle">V</text><text x="184.805" y="407" font-size="14" fill="#627168" text-anchor="middle">values</text><rect x="330.667" y="203" width="322.792" height="86" rx="6" fill="#f3f6f0" stroke="#dce1d8" /><text x="340.667" y="223" font-size="14" fill="#627168">1.</text><text x="360.667" y="223" font-size="14" fill="#243b32">scores = Q·K^T over all keys</text><text x="340.667" y="241" font-size="14" fill="#627168">2.</text><text x="360.667" y="241" font-size="14" fill="#243b32">scale ÷ √d_k keeps softmax gradients usable</text><text x="340.667" y="259" font-size="14" fill="#627168">3.</text><text x="360.667" y="259" font-size="14" fill="#243b32">softmax over keys → attention weights</text><text x="340.667" y="277" font-size="14" fill="#627168">4.</text><text x="360.667" y="277" font-size="14" font-weight="700" fill="#2f6f5e">weights · V → attention output</text><rect x="667.458" y="203" width="294.542" height="72" rx="8" fill="#fbfcfa" stroke="#dce1d8" /><text x="679.458" y="225" font-size="14" font-weight="700" fill="#243b32">Every position attends to all positions</text><text x="679.458" y="243" font-size="14" fill="#627168">No recurrence, no convolution in the model</text><rect id="frame-2" x="24" y="443" width="952" height="498" rx="12" fill="#ffffff" stroke="#dce1d8" stroke-width="1.5" /><rect x="38" y="457" width="434.438" height="26" rx="6" fill="#dce8cf" /><text x="50" y="475" font-size="15" font-weight="700" fill="#2f5d3a">2. Multi-Head Attention: h = 8 Parallel Attention Functions</text><rect x="38" y="493" width="298.667" height="246" rx="10" fill="#dce8cf" fill-opacity="0.35" stroke="#8aa87a" stroke-width="1.2" /><text x="52" y="509" font-size="14" font-weight="700" fill="#2f5d3a">Multi-Head Attention (h = 8)</text><rect x="52" y="529" width="270.667" height="50" rx="7" fill="#e1ebf1" stroke="#7f9fb5" stroke-width="1.5" /><text x="62" y="549" font-size="14" font-weight="700" fill="#2b5876">Encoder self-attention</text><text x="62" y="567" font-size="14" fill="#627168">softmax(QK^T/√d_k)V</text><rect x="52" y="593" width="270.667" height="68" rx="7" fill="#f1e3d8" stroke="#c9a08a" stroke-width="1.5" /><text x="62" y="613" font-size="14" font-weight="700" fill="#7a4a2e">Masked decoder self-attention</text><text x="62" y="631" font-size="14" fill="#627168">softmax(QK^T/√d_k + M)V, M = -∞</text><text x="62" y="649" font-size="14" fill="#627168">above diagonal</text><rect x="52" y="675" width="270.667" height="50" rx="7" fill="#ffffff" stroke="#c3ccbd" stroke-width="1" /><text x="62" y="695" font-size="14" font-weight="700" fill="#243b32">Encoder-decoder attention</text><text x="62" y="713" font-size="14" fill="#627168">MultiHead(Q_dec, K_enc, V_enc)</text><rect x="350.667" y="493" width="298.667" height="68" rx="7" fill="#dce8cf" stroke="#8aa87a" stroke-width="1.5" /><text x="360.667" y="513" font-size="14" font-weight="700" fill="#2f5d3a">Parallel heads → Concat → W^O</text><text x="360.667" y="531" font-size="14" fill="#627168">Concat(head_1..head_h)W^O, head_i =</text><text x="360.667" y="549" font-size="14" fill="#627168">Attention(QW^Q_i, KW^K_i, VW^V_i)</text><rect x="663.333" y="493" width="84.6719" height="26" rx="6" fill="#ffffff" stroke="#c3ccbd" /><text x="705.669" y="510" font-size="14" font-weight="700" fill="#243b32" text-anchor="middle">Q</text><text x="705.669" y="533" font-size="14" fill="#627168" text-anchor="middle">512 → 8×64</text><rect x="754.005" y="493" width="84.6719" height="26" rx="6" fill="#ffffff" stroke="#c3ccbd" /><text x="796.341" y="510" font-size="14" font-weight="700" fill="#243b32" text-anchor="middle">K</text><text x="796.341" y="533" font-size="14" fill="#627168" text-anchor="middle">512 → 8×64</text><rect x="844.677" y="493" width="84.6719" height="26" rx="6" fill="#ffffff" stroke="#c3ccbd" /><text x="887.013" y="510" font-size="14" font-weight="700" fill="#243b32" text-anchor="middle">V</text><text x="887.013" y="533" font-size="14" fill="#627168" text-anchor="middle">512 → 8×64</text><rect x="663.333" y="551" width="298.667" height="72" rx="8" fill="#fbfcfa" stroke="#dce1d8" /><text x="675.333" y="573" font-size="14" font-weight="700" fill="#243b32">Values: h = 8 heads of d_k = d_v = 64</text><text x="675.333" y="591" font-size="14" fill="#627168">W^Q_i, W^K_i, W^V_i ∈ R^(512×64); W^O</text><text x="675.333" y="609" font-size="14" fill="#627168">∈ R^(512×512)</text><text x="77.7969" y="765" font-size="14" fill="#627168" text-anchor="middle">y1</text><text x="111.797" y="765" font-size="14" fill="#627168" text-anchor="middle">y2</text><text x="145.797" y="765" font-size="14" fill="#627168" text-anchor="middle">y3</text><text x="54.7969" y="793" font-size="14" fill="#627168" text-anchor="end">y1</text><rect x="60.7969" y="771" width="34" height="34" fill="#dce8cf" stroke="#dce1d8" /><text x="77.7969" y="793" font-size="14" font-weight="700" text-anchor="middle">0.6</text><rect x="94.7969" y="771" width="34" height="34" fill="#ffffff" stroke="#dce1d8" /><text x="111.797" y="793" font-size="14" text-anchor="middle">−∞</text><rect x="128.797" y="771" width="34" height="34" fill="#ffffff" stroke="#dce1d8" /><text x="145.797" y="793" font-size="14" text-anchor="middle">−∞</text><text x="54.7969" y="827" font-size="14" fill="#627168" text-anchor="end">y2</text><rect x="60.7969" y="805" width="34" height="34" fill="#ffffff" stroke="#dce1d8" /><text x="77.7969" y="827" font-size="14" text-anchor="middle">0.4</text><rect x="94.7969" y="805" width="34" height="34" fill="#dce8cf" stroke="#dce1d8" /><text x="111.797" y="827" font-size="14" font-weight="700" text-anchor="middle">0.6</text><rect x="128.797" y="805" width="34" height="34" fill="#ffffff" stroke="#dce1d8" /><text x="145.797" y="827" font-size="14" text-anchor="middle">−∞</text><text x="54.7969" y="861" font-size="14" fill="#627168" text-anchor="end">y3</text><rect x="60.7969" y="839" width="34" height="34" fill="#ffffff" stroke="#dce1d8" /><text x="77.7969" y="861" font-size="14" text-anchor="middle">0.2</text><rect x="94.7969" y="839" width="34" height="34" fill="#ffffff" stroke="#dce1d8" /><text x="111.797" y="861" font-size="14" text-anchor="middle">0.3</text><rect x="128.797" y="839" width="34" height="34" fill="#dce8cf" stroke="#dce1d8" /><text x="145.797" y="861" font-size="14" font-weight="700" text-anchor="middle">0.5</text><text x="38" y="887" font-size="14" fill="#627168">Future positions set</text><text x="38" y="905" font-size="14" fill="#627168">to −∞ before</text><text x="38" y="923" font-size="14" fill="#627168">softmax</text><rect x="176.797" y="753" width="350.766" height="72" rx="8" fill="#fbfcfa" stroke="#dce1d8" /><text x="188.797" y="775" font-size="14" font-weight="700" fill="#243b32">Masked Self-Attention preserves</text><text x="188.797" y="793" font-size="14" fill="#627168">auto-regression</text><text x="188.797" y="811" font-size="14" fill="#627168">Concat head outputs project back to d_model = 512</text><path d="M 322.667 554 L 336.667 554 L 336.667 527 L 347.667 527" fill="none" stroke="#243b32" stroke-width="1.6" marker-end="url(#arrow)" /><path d="M 322.667 627 L 336.667 627 L 336.667 527 L 347.667 527" fill="none" stroke="#243b32" stroke-width="1.6" marker-end="url(#arrow)" /><path d="M 322.667 700 L 336.667 700 L 336.667 527 L 347.667 527" fill="none" stroke="#2f6f5e" stroke-width="1.6" marker-end="url(#arrow-accent)" /><rect id="frame-3" x="24" y="959" width="952" height="904" rx="12" fill="#ffffff" stroke="#dce1d8" stroke-width="1.5" /><rect x="38" y="973" width="459.375" height="26" rx="6" fill="#f1e3d8" /><text x="50" y="991" font-size="15" font-weight="700" fill="#7a4a2e">3. The Full Transformer: N = 6 Encoder-Decoder With Results</text><rect x="38" y="1009" width="460" height="68" rx="7" fill="#ffffff" stroke="#c3ccbd" stroke-width="1" /><text x="48" y="1029" font-size="14" font-weight="700" fill="#243b32">Source embedding</text><text x="48" y="1047" font-size="14" fill="#627168">d_model = 512; weights ×√d_model</text><rect x="38" y="1091" width="460" height="68" rx="7" fill="#ffffff" stroke="#c3ccbd" stroke-width="1" /><text x="48" y="1111" font-size="14" font-weight="700" fill="#243b32">Positional encoding</text><text x="48" y="1129" font-size="14" fill="#627168">d_model = 512; wavelengths 2π to 10000·2π</text><rect x="38" y="1173" width="460" height="90" rx="8" fill="#fbfcfa" stroke="#dce1d8" /><text x="50" y="1195" font-size="14" font-weight="700" fill="#243b32">PE(pos,2i) = sin(pos/10000^(2i/d_model));</text><text x="50" y="1213" font-size="14" fill="#627168">PE(pos,2i+1) = cos(pos/10000^(2i/d_model))</text><text x="50" y="1231" font-size="14" fill="#627168">Fixed sinusoids: the model has no recurrence or convolution</text><rect x="38" y="1277" width="460" height="250" rx="10" fill="#e1ebf1" fill-opacity="0.35" stroke="#7f9fb5" stroke-width="1.2" /><text x="52" y="1293" font-size="14" font-weight="700" fill="#2b5876">Encoder stack (N = 6)</text><rect x="52" y="1313" width="432" height="200" rx="10" fill="#e1ebf1" fill-opacity="0.35" stroke="#7f9fb5" stroke-width="1.2" /><text x="66" y="1329" font-size="14" font-weight="700" fill="#2b5876">Encoder layer</text><rect x="66" y="1349" width="404" height="68" rx="7" fill="#ffffff" stroke="#c3ccbd" stroke-width="1" /><text x="76" y="1369" font-size="14" font-weight="700" fill="#243b32">Add &amp; LayerNorm (encoder)</text><text x="76" y="1387" font-size="14" fill="#627168">LayerNorm(x + Sublayer(x))</text><rect x="66" y="1431" width="404" height="68" rx="7" fill="#ffffff" stroke="#c3ccbd" stroke-width="1" /><text x="76" y="1451" font-size="14" font-weight="700" fill="#243b32">Position-wise feed-forward (encoder)</text><text x="76" y="1469" font-size="14" fill="#627168">max(0, xW1 + b1)W2 + b2; 512 → 2048 → 512</text><rect x="512" y="1009" width="440.523" height="68" rx="7" fill="#ffffff" stroke="#c3ccbd" stroke-width="1" /><text x="522" y="1029" font-size="14" font-weight="700" fill="#243b32">Target embedding</text><text x="522" y="1047" font-size="14" fill="#627168">shares weights with source embedding and pre-softmax linear</text><rect x="512" y="1091" width="440.523" height="250" rx="10" fill="#f1e3d8" fill-opacity="0.35" stroke="#c9a08a" stroke-width="1.2" /><text x="526" y="1107" font-size="14" font-weight="700" fill="#7a4a2e">Decoder stack (N = 6)</text><rect x="526" y="1127" width="412.523" height="200" rx="10" fill="#f1e3d8" fill-opacity="0.35" stroke="#c9a08a" stroke-width="1.2" /><text x="540" y="1143" font-size="14" font-weight="700" fill="#7a4a2e">Decoder layer</text><rect x="540" y="1163" width="384.523" height="68" rx="7" fill="#ffffff" stroke="#c3ccbd" stroke-width="1" /><text x="550" y="1183" font-size="14" font-weight="700" fill="#243b32">Add &amp; LayerNorm (decoder)</text><text x="550" y="1201" font-size="14" fill="#627168">LayerNorm(x + Sublayer(x))</text><rect x="540" y="1245" width="384.523" height="68" rx="7" fill="#ffffff" stroke="#c3ccbd" stroke-width="1" /><text x="550" y="1265" font-size="14" font-weight="700" fill="#243b32">Position-wise feed-forward (decoder)</text><text x="550" y="1283" font-size="14" fill="#627168">max(0, xW1 + b1)W2 + b2; 512 → 2048 → 512</text><rect x="512" y="1355" width="440.523" height="68" rx="7" fill="#dce8cf" stroke="#8aa87a" stroke-width="1.5" /><text x="522" y="1375" font-size="14" font-weight="700" fill="#2f5d3a">Final linear + softmax</text><text x="522" y="1393" font-size="14" fill="#627168">softmax(hW^T); 512 → vocabulary logits</text><rect x="512" y="1437" width="440.523" height="68" rx="7" fill="#ffffff" stroke="#c3ccbd" stroke-width="1" /><text x="522" y="1457" font-size="14" font-weight="700" fill="#243b32">Transformer</text><text x="522" y="1475" font-size="14" fill="#627168">base: d_model = 512, 65M params; big: d_model = 1024, h = 16,</text><text x="522" y="1493" font-size="14" fill="#627168">P_drop = 0.3</text><text x="512" y="1534" font-size="14" fill="#627168">Transformer (big)</text><rect x="639.297" y="1523" width="159.453" height="14" rx="3" fill="#2f6f5e" /><text x="804.75" y="1534" font-size="14" font-weight="700">28.4</text><text x="512" y="1556" font-size="14" fill="#627168">Transformer (base)</text><rect x="639.297" y="1545" width="153.277" height="14" rx="3" fill="#c3ccbd" /><text x="798.574" y="1556" font-size="14">27.3</text><text x="512" y="1578" font-size="14" fill="#627168">ConvS2S</text><rect x="639.297" y="1567" width="141.487" height="14" rx="3" fill="#c3ccbd" /><text x="786.783" y="1578" font-size="14">25.2</text><text x="512" y="1600" font-size="14" fill="#627168">ByteNet</text><rect x="639.297" y="1589" width="133.626" height="14" rx="3" fill="#c3ccbd" /><text x="778.923" y="1600" font-size="14">23.8</text><text x="512" y="1621" font-size="14" fill="#627168">BLEU, WMT 2014 EN-DE; big = 41.8 EN-FR</text><rect x="512" y="1639" width="440.523" height="68" rx="7" fill="#ffffff" stroke="#c3ccbd" stroke-width="1" /><text x="522" y="1659" font-size="14" font-weight="700" fill="#243b32">Base hyperparameters</text><text x="522" y="1677" font-size="14" fill="#627168">d_model = 512, d_ff = 2048, h = 8, d_k = d_v = 64, P_drop = 0.1</text><rect x="512" y="1721" width="440.523" height="68" rx="7" fill="#ffffff" stroke="#c3ccbd" stroke-width="1" /><text x="522" y="1741" font-size="14" font-weight="700" fill="#243b32">Training</text><text x="522" y="1759" font-size="14" fill="#627168">100K steps, beam size 4, α = 0.6, ε_ls = 0.1; 3.5 days on 8 P100</text><text x="522" y="1777" font-size="14" fill="#627168">GPUs</text><path d="M 38 1043 L 24 1043 L 24 1383 L 63 1383" fill="none" stroke="#243b32" stroke-width="1.6" marker-end="url(#arrow)" /><path d="M 732.262 1077 L 732.262 1160" fill="none" stroke="#243b32" stroke-width="1.6" marker-end="url(#arrow)" /><path d="M 732.262 1231 L 732.262 1242" fill="none" stroke="#243b32" stroke-width="1.6" marker-end="url(#arrow)" /><path d="M 732.262 1313 L 732.262 1352" fill="none" stroke="#243b32" stroke-width="1.6" marker-end="url(#arrow)" /><text x="38" y="1827" font-size="14" font-weight="700" fill="#627168">Self-attention O(n^2·d) per layer; sequential ops O(1), path length O(1)</text><text x="38" y="1845" font-size="14" font-weight="700" fill="#627168">Parsing: still trails the Recurrent Neural Network Grammar</text><line x1="24" y1="1871" x2="976" y2="1871" stroke="#dce1d8" /><text x="24" y="1895" font-size="14"><tspan font-weight="700">Paper-grounded diagram.</tspan> Gains are on translation; on parsing it still trails the Recurrent Neural Network Grammar, and self-attention costs O(n^2·d) per</text><text x="24" y="1915" font-size="14">layer, worse than recurrent for long sequences. EN-FR big model used P_drop = 0.1 (41.0 vs 41.8 table).</text></svg>