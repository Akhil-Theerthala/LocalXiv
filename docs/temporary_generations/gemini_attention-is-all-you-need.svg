<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1551" font-family="Arial, sans-serif" font-size="14" fill="#243b32"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 2 L 8 5 L 1 8 Z" fill="#243b32"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 2 L 8 5 L 1 8 Z" fill="#627168"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 2 L 8 5 L 1 8 Z" fill="#2f6f5e"/></marker></defs><text x="24" y="36" font-size="14" fill="#627168">LOCALXIV · Attention Is All You Need</text><text x="24" y="66" font-size="26" font-weight="700">The Transformer Architecture and Attention Mechanisms</text><text x="24" y="101" font-size="15">Dispenses with recurrence and convolution, relying entirely on self-attention and position-wise feed-forward networks across stacked</text><text x="24" y="121" font-size="15">encoder-decoder sublayers.</text><rect id="frame-1" x="24" y="153" width="952" height="346" rx="12" fill="#ffffff" stroke="#dce1d8" stroke-width="1.5"/><rect x="38" y="167" width="481.562" height="26" rx="6" fill="#e1ebf1"/><text x="50" y="185" font-size="15" font-weight="700" fill="#2b5876">Core Mechanism: Scaled Dot-Product and Multi-Head Projection</text><rect x="38" y="203" width="391.7" height="122" rx="6" fill="#f3f6f0" stroke="#dce1d8"/><text x="48" y="223" font-size="14" fill="#627168">1.</text><text x="68" y="223" font-size="14" fill="#243b32">Input projections: Q = X W_Q, K = X W_K, V = X W_V</text><text x="48" y="241" font-size="14" fill="#627168">2.</text><text x="68" y="241" font-size="14" fill="#243b32">Scaled affinities: S = (Q · Kᵀ) / √(d_k)</text><text x="48" y="259" font-size="14" fill="#627168">3.</text><text x="68" y="259" font-size="14" fill="#243b32">Causal / autoregressive mask: S_ij = -∞ where j &gt; i</text><text x="48" y="277" font-size="14" fill="#627168">4.</text><text x="68" y="277" font-size="14" fill="#243b32">Softmax weights: A = softmax(S)</text><text x="48" y="295" font-size="14" fill="#627168">5.</text><text x="68" y="295" font-size="14" fill="#243b32">Attended values: Head_i = A · V (d_k = d_v = 64)</text><text x="48" y="313" font-size="14" fill="#627168">6.</text><text x="68" y="313" font-size="14" font-weight="700" fill="#2f6f5e">MultiHead(Q,K,V) = Concat(Head_1, ..., Head_h) W_O</text><text x="505.575" y="215" font-size="14" fill="#627168" text-anchor="middle">k1</text><text x="544.825" y="215" font-size="14" fill="#627168" text-anchor="middle">k2</text><text x="584.075" y="215" font-size="14" fill="#627168" text-anchor="middle">k3</text><text x="623.325" y="215" font-size="14" fill="#627168" text-anchor="middle">k4</text><text x="479.95" y="243" font-size="14" fill="#627168" text-anchor="end">pos 1</text><rect x="485.95" y="221" width="39.25" height="34" fill="#ffffff" stroke="#dce1d8"/><text x="505.575" y="243" font-size="14" text-anchor="middle">0.82</text><rect x="525.2" y="221" width="39.25" height="34" fill="#eef1ea" stroke="#dce1d8" stroke-dasharray="3 2"/><rect x="564.45" y="221" width="39.25" height="34" fill="#eef1ea" stroke="#dce1d8" stroke-dasharray="3 2"/><rect x="603.7" y="221" width="39.25" height="34" fill="#eef1ea" stroke="#dce1d8" stroke-dasharray="3 2"/><text x="479.95" y="277" font-size="14" fill="#627168" text-anchor="end">pos 2</text><rect x="485.95" y="255" width="39.25" height="34" fill="#ffffff" stroke="#dce1d8"/><text x="505.575" y="277" font-size="14" text-anchor="middle">0.45</text><rect x="525.2" y="255" width="39.25" height="34" fill="#ffffff" stroke="#dce1d8"/><text x="544.825" y="277" font-size="14" text-anchor="middle">0.55</text><rect x="564.45" y="255" width="39.25" height="34" fill="#eef1ea" stroke="#dce1d8" stroke-dasharray="3 2"/><rect x="603.7" y="255" width="39.25" height="34" fill="#eef1ea" stroke="#dce1d8" stroke-dasharray="3 2"/><text x="479.95" y="311" font-size="14" fill="#627168" text-anchor="end">pos 3</text><rect x="485.95" y="289" width="39.25" height="34" fill="#ffffff" stroke="#dce1d8"/><text x="505.575" y="311" font-size="14" text-anchor="middle">0.12</text><rect x="525.2" y="289" width="39.25" height="34" fill="#ffffff" stroke="#dce1d8"/><text x="544.825" y="311" font-size="14" text-anchor="middle">0.61</text><rect x="564.45" y="289" width="39.25" height="34" fill="#ffffff" stroke="#dce1d8"/><text x="584.075" y="311" font-size="14" text-anchor="middle">0.27</text><rect x="603.7" y="289" width="39.25" height="34" fill="#eef1ea" stroke="#dce1d8" stroke-dasharray="3 2"/><text x="479.95" y="345" font-size="14" fill="#627168" text-anchor="end">pos 4</text><rect x="485.95" y="323" width="39.25" height="34" fill="#ffffff" stroke="#dce1d8"/><text x="505.575" y="345" font-size="14" text-anchor="middle">0.05</text><rect x="525.2" y="323" width="39.25" height="34" fill="#ffffff" stroke="#dce1d8"/><text x="544.825" y="345" font-size="14" text-anchor="middle">0.18</text><rect x="564.45" y="323" width="39.25" height="34" fill="#ffffff" stroke="#dce1d8"/><text x="584.075" y="345" font-size="14" text-anchor="middle">0.41</text><rect x="603.7" y="323" width="39.25" height="34" fill="#dce8cf" stroke="#dce1d8"/><text x="623.325" y="345" font-size="14" font-weight="700" text-anchor="middle">0.36</text><text x="443.7" y="371" font-size="14" fill="#627168">Decoder causal attention</text><text x="443.7" y="389" font-size="14" fill="#627168">masking (-∞ prevents looking</text><text x="443.7" y="407" font-size="14" fill="#627168">ahead)</text><rect x="656.95" y="203" width="305.05" height="282" rx="10" fill="#fbfcfa" fill-opacity="0.35" stroke="#dce1d8" stroke-width="1.2"/><text x="670.95" y="219" font-size="14" font-weight="700" fill="#243b32">Hyperparameters</text><rect x="670.95" y="239" width="277.05" height="68" rx="7" fill="#ffffff" stroke="#c3ccbd" stroke-width="1"/><text x="680.95" y="259" font-size="14" font-weight="700" fill="#243b32">Model Dimension</text><text x="680.95" y="277" font-size="14" fill="#627168">d_model = 512, d_ff = 2048</text><rect x="670.95" y="321" width="277.05" height="68" rx="7" fill="#ffffff" stroke="#c3ccbd" stroke-width="1"/><text x="680.95" y="341" font-size="14" font-weight="700" fill="#243b32">Head Allocation</text><text x="680.95" y="359" font-size="14" fill="#627168">h = 8 parallel heads, d_k = d_v = 64</text><rect x="670.95" y="403" width="277.05" height="68" rx="7" fill="#ffffff" stroke="#c3ccbd" stroke-width="1"/><text x="680.95" y="423" font-size="14" font-weight="700" fill="#243b32">Inference Search</text><text x="680.95" y="441" font-size="14" fill="#627168">beam size = 4, length penalty alpha = 0.6</text><rect id="frame-2" x="24" y="517" width="952" height="560" rx="12" fill="#ffffff" stroke="#dce1d8" stroke-width="1.5"/><rect x="38" y="531" width="406.609" height="26" rx="6" fill="#dce8cf"/><text x="50" y="549" font-size="15" font-weight="700" fill="#2f5d3a">Transformer Model: Dual Stack Sublayer Connectivity</text><rect x="38" y="567" width="448.682" height="332" rx="10" fill="#fbfcfa" fill-opacity="0.35" stroke="#dce1d8" stroke-width="1.2"/><text x="52" y="583" font-size="14" font-weight="700" fill="#243b32">Encoder Stack ×6</text><rect x="52" y="603" width="420.682" height="68" rx="7" fill="#f3f6f0" stroke="#dce1d8" stroke-width="1"/><text x="62" y="623" font-size="14" font-weight="700" fill="#243b32">Input Embedding and Positional Encoding</text><text x="62" y="641" font-size="14" fill="#627168">x = Embedding(tokens) · √(d_model) + PE</text><rect x="52" y="685" width="420.682" height="200" rx="10" fill="#fbfcfa" fill-opacity="0.35" stroke="#dce1d8" stroke-width="1.2"/><text x="66" y="701" font-size="14" font-weight="700" fill="#243b32">Encoder Layer ×6</text><rect x="66" y="721" width="392.682" height="68" rx="7" fill="#e1ebf1" stroke="#7f9fb5" stroke-width="1.5"/><text x="76" y="741" font-size="14" font-weight="700" fill="#2b5876">Encoder Multi-Head Self-Attention Sublayer</text><text x="76" y="759" font-size="14" fill="#627168">LayerNorm(x + MultiHead(x, x, x))</text><rect x="66" y="803" width="392.682" height="68" rx="7" fill="#ffffff" stroke="#c3ccbd" stroke-width="1"/><text x="76" y="823" font-size="14" font-weight="700" fill="#243b32">Encoder Position-wise Feed-Forward Sublayer</text><text x="76" y="841" font-size="14" fill="#627168">LayerNorm(x + (max(0, xW1 + b1)W2 + b2))</text><rect x="500.682" y="567" width="460" height="496" rx="10" fill="#fbfcfa" fill-opacity="0.35" stroke="#dce1d8" stroke-width="1.2"/><text x="514.682" y="583" font-size="14" font-weight="700" fill="#243b32">Decoder Stack ×6</text><rect x="514.682" y="603" width="432" height="68" rx="7" fill="#f3f6f0" stroke="#dce1d8" stroke-width="1"/><text x="524.682" y="623" font-size="14" font-weight="700" fill="#243b32">Output Embedding and Positional Encoding</text><text x="524.682" y="641" font-size="14" fill="#627168">y = Embedding(tokens) · √(d_model) + PE</text><rect x="514.682" y="685" width="432" height="282" rx="10" fill="#fbfcfa" fill-opacity="0.35" stroke="#dce1d8" stroke-width="1.2"/><text x="528.682" y="701" font-size="14" font-weight="700" fill="#243b32">Decoder Layer ×6</text><rect x="528.682" y="721" width="404" height="68" rx="7" fill="#f1e3d8" stroke="#c9a08a" stroke-width="1.5"/><text x="538.682" y="741" font-size="14" font-weight="700" fill="#7a4a2e">Decoder Masked Multi-Head Self-Attention</text><text x="538.682" y="759" font-size="14" fill="#627168">LayerNorm(x + MultiHead(x, x, x)) with mask</text><rect x="528.682" y="803" width="404" height="68" rx="7" fill="#dce8cf" stroke="#8aa87a" stroke-width="1.5"/><text x="538.682" y="823" font-size="14" font-weight="700" fill="#2f5d3a">Encoder-Decoder Multi-Head Attention Sublayer</text><text x="538.682" y="841" font-size="14" fill="#627168">LayerNorm(x + MultiHead(Q_dec, K_enc, V_enc))</text><rect x="528.682" y="885" width="404" height="68" rx="7" fill="#ffffff" stroke="#c3ccbd" stroke-width="1"/><text x="538.682" y="905" font-size="14" font-weight="700" fill="#243b32">Decoder Position-wise Feed-Forward Sublayer</text><text x="538.682" y="923" font-size="14" fill="#627168">LayerNorm(x + (max(0, xW1 + b1)W2 + b2))</text><rect x="514.682" y="981" width="432" height="68" rx="7" fill="#ffffff" stroke="#c3ccbd" stroke-width="1"/><text x="524.682" y="1001" font-size="14" font-weight="700" fill="#243b32">Linear Projection and Softmax</text><text x="524.682" y="1019" font-size="14" fill="#627168">softmax(xW_embed^T)</text><path d="M 262.341 671 L 262.341 718" fill="none" stroke="#243b32" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M 262.341 789 L 262.341 800" fill="none" stroke="#243b32" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M 730.682 671 L 730.682 718" fill="none" stroke="#243b32" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M 730.682 789 L 730.682 800" fill="none" stroke="#243b32" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M 458.682 837 L 525.682 837" fill="none" stroke="#2f6f5e" stroke-width="1.6" marker-end="url(#arrow-accent)"/><path d="M 730.682 871 L 730.682 882" fill="none" stroke="#243b32" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M 730.682 953 L 730.682 978" fill="none" stroke="#243b32" stroke-width="1.6" marker-end="url(#arrow)"/><rect id="frame-3" x="24" y="1095" width="952" height="368" rx="12" fill="#ffffff" stroke="#dce1d8" stroke-width="1.5"/><rect x="38" y="1109" width="376.625" height="26" rx="6" fill="#f1e3d8"/><text x="50" y="1127" font-size="15" font-weight="700" fill="#7a4a2e">Translation Performance: WMT 2014 Benchmarks</text><text x="38" y="1160" font-size="14" fill="#627168">Prior Best EN-DE</text><rect x="212.75" y="1149" width="65.8125" height="14" rx="3" fill="#c3ccbd"/><text x="284.562" y="1160" font-size="14">26.4</text><text x="38" y="1182" font-size="14" fill="#627168">Transformer (base) EN-DE</text><rect x="212.75" y="1171" width="68.0561" height="14" rx="3" fill="#c3ccbd"/><text x="286.806" y="1182" font-size="14">27.3</text><text x="38" y="1204" font-size="14" fill="#627168">Transformer (big) EN-DE</text><rect x="212.75" y="1193" width="70.7983" height="14" rx="3" fill="#c3ccbd"/><text x="289.548" y="1204" font-size="14">28.4</text><text x="38" y="1226" font-size="14" fill="#627168">Prior Best EN-FR</text><rect x="212.75" y="1215" width="102.932" height="14" rx="3" fill="#c3ccbd"/><text x="321.682" y="1226" font-size="14">41.29</text><text x="38" y="1248" font-size="14" fill="#627168">Transformer (big) EN-FR</text><rect x="212.75" y="1237" width="104.203" height="14" rx="3" fill="#2f6f5e"/><text x="322.953" y="1248" font-size="14" font-weight="700">41.8</text><text x="38" y="1269" font-size="14" fill="#627168">BLEU scores on WMT 2014 English-to-German</text><text x="38" y="1287" font-size="14" fill="#627168">and English-to-French</text><rect x="372" y="1145" width="460" height="304" rx="10" fill="#fbfcfa" fill-opacity="0.35" stroke="#dce1d8" stroke-width="1.2"/><text x="386" y="1161" font-size="14" font-weight="700" fill="#243b32">Per-Layer Complexity vs Recurrence</text><rect x="386" y="1181" width="432" height="68" rx="7" fill="#dce8cf" stroke="#8aa87a" stroke-width="1.5"/><text x="396" y="1201" font-size="14" font-weight="700" fill="#2f5d3a">Self-Attention Complexity</text><text x="396" y="1219" font-size="14" fill="#627168">O(n² · d) complexity, O(1) sequential operations</text><rect x="386" y="1263" width="432" height="68" rx="7" fill="#f3f6f0" stroke="#dce1d8" stroke-width="1"/><text x="396" y="1283" font-size="14" font-weight="700" fill="#243b32">Recurrent Layer Complexity</text><text x="396" y="1301" font-size="14" fill="#627168">O(n · d²) complexity, O(n) sequential operations</text><rect x="386" y="1345" width="432" height="90" rx="8" fill="#fbfcfa" stroke="#dce1d8"/><text x="398" y="1367" font-size="14" font-weight="700" fill="#243b32">Maximum path length between tokens:</text><text x="398" y="1385" font-size="14" fill="#627168">• Self-Attention: O(1) direct connectivity</text><text x="398" y="1403" font-size="14" fill="#627168">• Recurrent: O(n) steps across sequence</text><line x1="24" y1="1471" x2="976" y2="1471" stroke="#dce1d8"/><text x="24" y="1495" font-size="14"><tspan font-weight="700">Paper-grounded diagram.</tspan> WMT 2014 state-of-the-art: 28.4 BLEU (EN-DE) and 41.8 BLEU (EN-FR). Self-attention per-layer complexity is O(n² · d),</text><text x="24" y="1515" font-size="14">optimal when sequence length n is smaller than representation dimension d.</text></svg>