<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>arXiv to Kindle</title>
    <link rel="stylesheet" href="popup.css" />
    <script src="popup.js" defer></script>
  </head>
  <body>
    <main>
      <p class="eyebrow">ARXIV → KINDLE</p>
      <h1>Send this paper</h1>
      <form id="send-form">
        <label for="kindle-email">Send-to-Kindle address</label>
        <input
          id="kindle-email"
          name="kindle-email"
          type="email"
          inputmode="email"
          autocomplete="email"
          placeholder="name@kindle.com"
          required
        />
        <button id="send" type="submit">Send to Kindle</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <a id="manual" href="https://www.amazon.com/sendtokindle" target="_blank" hidden>
        Upload the saved EPUB manually
      </a>
    </main>
  </body>
</html>
