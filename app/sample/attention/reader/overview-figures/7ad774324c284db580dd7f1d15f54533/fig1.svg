<text x="44" y="74" text-anchor="start" font-size="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#3d5130" opacity="1">Why discard recurrent </text>
<text x="44" y="116" text-anchor="start" font-size="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#3d5130" opacity="1">layers?</text>
<text x="44" y="170" text-anchor="start" font-size="24" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#292d23" opacity="1">Recurrence computes hidden </text>
<text x="44" y="203.6" text-anchor="start" font-size="24" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#292d23" opacity="1">states sequentially, blocking </text>
<text x="44" y="237.2" text-anchor="start" font-size="24" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#292d23" opacity="1">parallel training across </text>
<text x="44" y="270.79999999999995" text-anchor="start" font-size="24" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#292d23" opacity="1">positions; convolutions require</text>
<text x="44" y="304.4" text-anchor="start" font-size="24" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#292d23" opacity="1">multi-layer paths to connect </text>
<text x="44" y="338" text-anchor="start" font-size="24" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#292d23" opacity="1">distant tokens.</text>
