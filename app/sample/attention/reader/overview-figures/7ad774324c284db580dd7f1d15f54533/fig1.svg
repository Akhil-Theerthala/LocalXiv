<text x="593.4573643410853" y="74" text-anchor="start" font-size="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#3d5130" opacity="1">How does scaled dot-product</text>
<text x="593.4573643410853" y="116" text-anchor="start" font-size="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#3d5130" opacity="1">work?</text>
<text x="593.4573643410853" y="170" text-anchor="start" font-size="24" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#292d23" opacity="1">It computes query-key dot products</text>
<text x="593.4573643410853" y="203.6" text-anchor="start" font-size="24" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#292d23" opacity="1">scaled by 1/sqrt(d_k) before </text>
<text x="593.4573643410853" y="237.2" text-anchor="start" font-size="24" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#292d23" opacity="1">softmax to prevent vanishing </text>
<text x="593.4573643410853" y="270.79999999999995" text-anchor="start" font-size="24" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#292d23" opacity="1">gradients at large dimensions, </text>
<text x="593.4573643410853" y="304.4" text-anchor="start" font-size="24" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#292d23" opacity="1">producing value weights in O(1) </text>
<text x="593.4573643410853" y="338" text-anchor="start" font-size="24" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#292d23" opacity="1">operations.</text>
<rect x="16" y="391.6" width="432.9632892804699" height="645.2" rx="8" ry="8" fill="#d6dfc7" stroke="transparent" stroke-width="2" opacity="1"/>

<text x="44" y="449.6" text-anchor="start" font-size="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#3d5130" opacity="1">Why split into </text>
<text x="44" y="491.6" text-anchor="start" font-size="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#3d5130" opacity="1">multiple heads?</text>
<text x="44" y="545.6" text-anchor="start" font-size="24" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#292d23" opacity="1">Projecting queries, keys,</text>
<text x="44" y="579.2" text-anchor="start" font-size="24" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#292d23" opacity="1">and values into 8 </text>
<text x="44" y="612.8" text-anchor="start" font-size="24" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#292d23" opacity="1">parallel heads (d_k=64) </text>
<text x="44" y="646.4" text-anchor="start" font-size="24" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#292d23" opacity="1">allows joint attention </text>
<text x="44" y="680" text-anchor="start" font-size="24" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#292d23" opacity="1">across distinct </text>
<text x="44" y="713.6" text-anchor="start" font-size="24" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#292d23" opacity="1">representation subspaces,</text>
<text x="44" y="747.2" text-anchor="start" font-size="24" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#292d23" opacity="1">overcoming single-head </text>
<text x="44" y="780.8" text-anchor="start" font-size="24" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#292d23" opacity="1">averaging loss.</text>
