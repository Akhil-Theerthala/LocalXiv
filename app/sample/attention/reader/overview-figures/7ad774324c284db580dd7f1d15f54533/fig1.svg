<text x="44" y="1110.8000000000002" text-anchor="start" font-size="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#3d5130" opacity="1">What translation </text>
<text x="44" y="1152.8000000000002" text-anchor="start" font-size="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#3d5130" opacity="1">performance was achieved?</text>
<text x="44" y="1206.8000000000002" text-anchor="start" font-size="24" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#292d23" opacity="1">The Transformer reached 28.4 BLEU </text>
<text x="44" y="1240.4" text-anchor="start" font-size="24" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#292d23" opacity="1">on WMT 2014 English-German and </text>
