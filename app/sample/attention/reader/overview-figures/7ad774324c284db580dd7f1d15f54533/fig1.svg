<text x="44" y="1307.6000000000001" text-anchor="start" font-size="24" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#292d23" opacity="1">outperforming prior ensembles </text>
<text x="44" y="1341.2000000000003" text-anchor="start" font-size="24" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#292d23" opacity="1">while training on 8 GPUs for 3.5 </text>
