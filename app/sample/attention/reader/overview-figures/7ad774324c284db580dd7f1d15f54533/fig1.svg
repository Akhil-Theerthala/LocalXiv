<text x="635.9999999999999" y="1164.8000000000002" text-anchor="start" font-size="24" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#292d23" opacity="1">Decoder inference remains </text>
<text x="635.9999999999999" y="1198.4" text-anchor="start" font-size="24" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#292d23" opacity="1">auto-regressively sequential, </text>
<text x="635.9999999999999" y="1232.0000000000002" text-anchor="start" font-size="24" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#292d23" opacity="1">and attention complexity scales</text>
