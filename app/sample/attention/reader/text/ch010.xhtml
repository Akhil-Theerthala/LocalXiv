<section id="sec:viz-att" class="level1 unnumbered">
<h1 class="unnumbered" id="heading-30">Attention Visualizations</h1>
<figure data-latex-placement="h" id="p00122">
<p><span><img src="../media/file3.png" alt="image" /></span></p>
<figcaption>An example of the attention mechanism following long-distance dependencies in the encoder self-attention in layer 5 of 6. Many of the attention heads attend to a distant dependency of the verb ‘making’, completing the phrase ‘making...more difficult’. Attentions here shown only for the word ‘making’. Different colors represent different heads. Best viewed in color.</figcaption>
</figure>
<figure id="p00123">
<p><span><img src="../media/file4.png" alt="image" /></span> <span><img src="../media/file5.png" alt="image" /></span></p>
<figcaption>Two attention heads, also in layer 5 of 6, apparently involved in anaphora resolution. Top: Full attentions for head 5. Bottom: Isolated attentions from just the word ‘its’ for attention heads 5 and 6. Note that the attentions are very sharp for this word.</figcaption>
</figure>
<figure id="p00124">
<p><span><img src="../media/file6.png" alt="image" /></span> <span><img src="../media/file7.png" alt="image" /></span></p>
<figcaption>Many of the attention heads exhibit behaviour that seems related to the structure of the sentence. We give two such examples above, from two different heads from the encoder self-attention at layer 5 of 6. The heads clearly learned to perform different tasks.</figcaption>
</figure>
